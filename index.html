      const tr = ' fill="none" stroke="' + C.pinkDk + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
      if (n === "taza") return '<path d="M-14 -10 H12 V8 Q12 16 4 16 H-6 Q-14 16 -14 8 Z"' + tr + '/><path d="M12 -5 H18 Q22 -5 22 1 Q22 7 12 7"' + tr + '/>';
      if (n === "pluma") return '<path d="M-14 16 L14 -16 Q4 -4 6 6 Q-4 8 -14 16 Z"' + tr + '/><path d="M-14 16 L2 0"' + tr + '/>';
      if (n === "reloj") return '<circle r="15"' + tr + '/><path d="M0 -8 V0 L7 4"' + tr + '/>';
      if (n === "candado") return '<rect x="-12" y="-3" width="24" height="19" rx="2"' + tr + '/><path d="M-7 -3 V-9 Q-7 -17 0 -17 Q7 -17 7 -9 V-3"' + tr + '/>';
      return simbolo(n, 0, 0, 1.7, C.pinkDk);
    }
    let svg = fondoCierre(101);
    svg += '<text x="180" y="96" text-anchor="middle" font-size="10" letter-spacing="5" fill="' + C.cream2 + '">ARCHIVO · ENCONTRAR LOS PARES</text>';
    mazo.forEach((n, i) => {
      const x = BX + (i % COLS) * (CW + GAP), y = BY + ((i / COLS) | 0) * (CH + GAP);
      const R = rng(900 + i * 17);
      svg += '<g transform="translate(' + (x + (R() * 4 - 2)).toFixed(1) + " " + (y + (R() * 4 - 2)).toFixed(1) + ") rotate(" + ((R() - 0.5) * 3.4).toFixed(1) + " " + CW / 2 + " " + CH / 2 + ')"><g class="p3c" data-i="' + i + '" style="transform-box:fill-box;transform-origin:center;transition:transform .14s linear">' +
        '<g class="p3b"><rect width="' + CW + '" height="' + CH + '" rx="5" fill="' + C.pinkDk + '" stroke="' + C.pinkPl + '" stroke-width="2"/>' +
        '<rect x="8" y="8" width="' + (CW - 16) + '" height="' + (CH - 16) + '" rx="3" fill="none" stroke="' + C.pinkPl + '" stroke-width="1.2" opacity=".7"/>' +
        '<circle cx="' + (CW / 2 + (R() * 6 - 3)).toFixed(1) + '" cy="' + (CH / 2 + (R() * 6 - 3)).toFixed(1) + '" r="' + (7 + R() * 3).toFixed(1) + '" fill="' + C.pinkPl + '" opacity=".8"/>' +
        mancha(10 + R() * 70, 14 + R() * 84, 8, C.wood, 0.16, 300 + i) + '</g>' +
        '<g class="p3f" style="display:none"><rect width="' + CW + '" height="' + CH + '" rx="5" fill="' + C.cream + '" stroke="' + C.cream2 + '" stroke-width="2"/>' +
        '<g transform="translate(' + CW / 2 + " " + CH / 2 + ') rotate(' + ((R() - 0.5) * 14).toFixed(1) + ') scale(' + (D ? 0.8 : 1) + ')">' + dibujo(n) + "</g>" + mancha(70, 94, 9, C.kraftDk, 0.22, 400 + i) + "</g></g></g>";
    });
    const wrap = makeSVG(svg);
    const el = wrap.querySelector("svg");
    const cartas = [...el.querySelectorAll(".p3c")];
    const volteada = mazo.map(() => false), resuelta = mazo.map(() => false);
    let abiertas = [], bloqueo = false, parejas = 0, resolver, vivo = true;
    const ok = new Promise((r) => (resolver = r));
    wrap.dataset.mem = mazo.join(",");

    function girar(i, arriba) {
      const c = cartas[i];
      c.style.transform = "scaleX(0)";
      setTimeout(() => {
        c.querySelector(".p3b").style.display = arriba ? "none" : "";
        c.querySelector(".p3f").style.display = arriba ? "" : "none";
        c.style.transform = "scaleX(1)";
      }, 150);
      volteada[i] = arriba;
    }
    el.addEventListener("pointerdown", (e) => {
      const i = tocado(e);
      if (i < 0 || bloqueo || volteada[i] || resuelta[i]) return;
      Sonido.play("voltear"); girar(i, true); abiertas.push(i);
      if (abiertas.length < 2) return;
      const [a, b] = abiertas; abiertas = []; bloqueo = true;
      if (mazo[a] === mazo[b]) {
        resuelta[a] = resuelta[b] = true; parejas++;
        setTimeout(() => {
          Sonido.play("par"); bloqueo = false;
          if (parejas === NOMBRES.length) { Sonido.play("sello"); setTimeout(() => vivo && resolver(), 900); }
        }, 450);
      } else {
        setTimeout(() => { if (!vivo) return; girar(a, false); girar(b, false); setTimeout(() => (bloqueo = false), 330); }, D ? 620 : 850);
      }
    });
    return { el: wrap, resuelto: ok, alEntrar() { UI.say(D ? "Diez pares, veinte cartas. Hay que mirar con atención." : "Seis pares, todos mezclados en el archivo.", 4200); }, destruir() { vivo = false; } };
  }
};

// ===================================================================
// PASO 4 · SECUENCIA DE LA RADIO (sala 4) · repetir la melodía
// ===================================================================
const Paso4 = {
  pistas: [
    "La radio toca una melodía de notas de colores. Escuchala y repetila tocando los botones. Cada ronda suma una nota.",
    "Si te equivocás, la melodía se repite igual desde el principio. No cambia.",
    "Podés tocar REPETIR para volver a escuchar. Acordate del orden de los colores, no de los sonidos."
  ],
  construir() {
    const COL = [C.amber, C.cream, C.blue, C.pink];
    const TON = [330, 392, 494, 587];
    const D = false;
    const RONDAS = D ? [4, 5, 6, 7, 8, 9] : [3, 4, 5, 6];
    const secuencia = Array.from({ length: 9 }, () => (Math.random() * 4) | 0);
    const PX = [46, 184], PY = [236, 372], PS = 130;

    let svg = '<rect x="-80" y="-20" width="520" height="780" fill="' + C.night + '"/>';
    svg += '<g filter="url(#mano)"><rect x="22" y="86" width="316" height="566" rx="22" fill="' + C.wood + '" stroke="#2a2030" stroke-width="2"/>' +
      vetas(24, 90, 312, 60, 4, "#2a2030", 0.5, 111) + vetas(24, 600, 312, 48, 4, "#2a2030", 0.5, 112) +
      '<rect x="36" y="100" width="288" height="538" rx="14" fill="' + C.night2 + '"/></g>' +
      '<text x="180" y="124" text-anchor="middle" font-size="10" letter-spacing="5" fill="' + C.cream2 + '">REPETIR LA MELODÍA</text>' +
      '<rect x="60" y="140" width="240" height="44" rx="6" fill="' + C.deep + '"/>' +
      '<text id="p4txt" x="180" y="168" text-anchor="middle" font-size="14" letter-spacing="5" fill="' + C.pink + '">ESCUCHÁ</text>';
    for (let r = 0; r < RONDAS.length; r++) svg += '<circle class="p4d" cx="' + (180 - (RONDAS.length - 1) * 10 + r * 20) + '" cy="208" r="5" fill="' + C.night3 + '"/>';
    for (let k = 0; k < 4; k++) {
      const x = PX[k % 2], y = PY[(k / 2) | 0];
      svg += '<g class="p4p" data-i="' + k + '" style="transition:opacity .08s"><rect x="' + x + '" y="' + y + '" width="' + PS + '" height="' + PS + '" rx="12" fill="' + COL[k] + '" opacity=".38" class="p4r" stroke="' + COL[k] + '" stroke-width="2"/></g>';
    }
    svg += '<g data-i="9" class="p4rep"><rect x="116" y="534" width="128" height="40" rx="6" fill="none" stroke="' + C.cream2 + '" stroke-width="1.5"/>' +
      '<text x="180" y="560" text-anchor="middle" font-size="12" letter-spacing="5" fill="' + C.cream2 + '">REPETIR</text></g>';

    const wrap = makeSVG(svg);
    const el = wrap.querySelector("svg");
    const rects = [...el.querySelectorAll(".p4r")];
    const puntos = [...el.querySelectorAll(".p4d")];
    const txt = el.querySelector("#p4txt");
    let ronda = 0, indice = 0, turno = false, vivo = true, resolver, tokenReprod = 0;
    const ok = new Promise((r) => (resolver = r));
    wrap.dataset.seq = secuencia.join(",");

    function estado(t) { txt.textContent = t; wrap.dataset.estado = t === "TU TURNO" ? "turno" : "escucha"; }
    function luz(k, on) { rects[k].setAttribute("opacity", on ? 1 : 0.38); }
    async function sonar(k, ms) {
      luz(k, true); Sonido.nota(TON[k]);
      await sleep(ms || (D ? 300 : 380)); luz(k, false); await sleep(D ? 110 : 160);
    }
    async function reproducir() {
      const mi = ++tokenReprod; turno = false; indice = 0; estado("ESCUCHÁ");
      await sleep(650);
      for (let i = 0; i < RONDAS[ronda]; i++) {
        if (!vivo || mi !== tokenReprod) return;
        await sonar(secuencia[i]);
      }
      if (vivo && mi === tokenReprod) { turno = true; estado("TU TURNO"); }
    }
    el.addEventListener("pointerdown", async (e) => {
      const k = tocado(e);
      if (k < 0) return;
      if (k === 9) { if (turno || wrap.dataset.estado === "turno") reproducir(); return; }
      if (!turno) return;
      sonar(k, 240);
      if (k !== secuencia[indice]) {
        turno = false; Sonido.play("error"); estado("OTRA VEZ");
        await sleep(900); if (vivo) reproducir(); return;
      }
      indice++;
      if (indice < RONDAS[ronda]) return;
      turno = false; puntos[ronda].setAttribute("fill", C.pink); ronda++;
      if (ronda >= RONDAS.length) {
        estado("SEÑAL FIJADA"); Sonido.play("sello");
        setTimeout(() => vivo && resolver(), 1200); return;
      }
      Sonido.play("par"); estado("BIEN");
      await sleep(900); if (vivo) reproducir();
    });
    return { el: wrap, resuelto: ok, alEntrar() { UI.say("La radio repite una melodía. Hay que devolvérsela.", 4200); reproducir(); }, destruir() { vivo = false; } };
  }
};

const PASOS2 = [Paso1, Paso2, Paso3, Paso4];

</script>
<script>
/*
 ////////////////////////////////////////////////////////////////////
 ///////////  TERCEROS DESAFÍOS (SOLO MODO DIFÍCIL, PASO 3)  ////////
 ////////////////////////////////////////////////////////////////////
 Una prueba extra por sala. En la versión normal este archivo se carga
 igual, pero EXTRAS nunca se usa (main.js solo lo lee si CONFIG.DIFICIL).
   Extra1 · Lámparas      (sala 1)  apagar un tablero 5x5
   Extra2 · Sellos        (sala 2)  adivinar el orden secreto (mastermind)
   Extra3 · Torre         (sala 3)  torre de Hanoi de 5 sellos
   Extra4 · Tormenta      (sala 4)  atrapar sobres con sello rosa
 Todos exponen { pistas[3], construir() → { el, resuelto, alEntrar, destruir } }
*/

// ===================================================================
// CABECERA COMÚN
// ===================================================================
function cabeceraExtra(titulo, sub) {
  return '<text x="180" y="86" text-anchor="middle" font-size="10" letter-spacing="5" fill="' + C.cream2 + '">' + titulo + "</text>" +
    '<text id="exsub" x="180" y="108" text-anchor="middle" font-size="12" letter-spacing="3" fill="' + C.pink + '">' + sub + "</text>";
}

// ===================================================================
// EXTRA 1 · LÁMPARAS (sala 1) · lights out 5x5
// ===================================================================
const Extra1 = {
  pistas: [
    "Cada lámpara que tocás se cambia a sí misma y a sus cuatro vecinas (arriba, abajo, izquierda y derecha). Hay que dejarlas todas apagadas.",
    "El orden en que tocás no importa, y tocar dos veces la misma lámpara no cambia nada.",
    "Cada toque dibuja una cruz de cinco lámparas (la tocada y sus cuatro vecinas). El tablero apagado se desordenó con unos pocos toques, así que hay que deshacerlos: busca dónde habría un centro de cruz.",
    "Tocá una lámpara prendida que tenga prendidas varias vecinas: eso suele ser un centro de cruz. Si el tablero queda peor, tocala otra vez para deshacerlo o usá REINICIAR.",
    "Método seguro: recorré las filas de arriba hacia abajo. Si una lámpara está prendida, tocá la que está justo debajo de ella (así la apagás sin tocar nada de arriba). Al llegar a la última fila, REINICIAR y probá empezar tocando otra lámpara de la fila de arriba."
  ],
  construir() {
    const N = 5, S = 50, G = 6, BX = (360 - (N * S + (N - 1) * G)) / 2, BY = 190;
    const pulsa = (a, i) => {
      const x = i % N, y = (i / N) | 0;
      [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
        const X = x + dx, Y = y + dy;
        if (X >= 0 && X < N && Y >= 0 && Y < N) a[Y * N + X] ^= 1;
      });
    };
    function mezcla() {
      let a;
      do {
        a = new Array(N * N).fill(0);
        const n = 4 + ((Math.random() * 3) | 0);
        for (let k = 0; k < n; k++) pulsa(a, (Math.random() * N * N) | 0);
      } while (a.reduce((s, v) => s + v, 0) < 6);
      return a;
    }
    let inicio = mezcla(), b = inicio.slice(), movs = 0, hecho = false, vivo = true, resolver;
    const ok = new Promise((r) => (resolver = r));

    let svg = fondoCierre(901) + cabeceraExtra("TABLERO DE LÁMPARAS", "APAGALAS TODAS");
    svg += '<rect x="' + (BX - 10) + '" y="' + (BY - 10) + '" width="' + (N * S + (N - 1) * G + 20) + '" height="' + (N * S + (N - 1) * G + 20) + '" rx="6" fill="' + C.night + '" stroke="#2a2030" stroke-width="2"/>';
    for (let i = 0; i < N * N; i++) {
      svg += '<rect class="exl" data-i="' + i + '" x="' + (BX + (i % N) * (S + G)) + '" y="' + (BY + ((i / N) | 0) * (S + G)) + '" width="' + S + '" height="' + S + '" rx="4" fill="' + C.night3 + '" stroke="#2a2030" stroke-width="1.5"/>';
    }
    svg += '<text id="exmov" x="180" y="548" text-anchor="middle" font-size="12" letter-spacing="3" fill="' + C.cream2 + '">MOVIMIENTOS 0</text>' +
      '<g data-i="99"><rect x="120" y="580" width="120" height="38" rx="6" fill="none" stroke="' + C.cream2 + '" stroke-width="1.5"/>' +
      '<text x="180" y="604" text-anchor="middle" font-size="12" letter-spacing="4" fill="' + C.cream2 + '">REINICIAR</text></g>' +
      '<g data-i="98"><rect x="250" y="580" width="90" height="38" rx="6" fill="none" stroke="' + C.pink + '" stroke-width="1.5"/>' +
      '<text x="295" y="604" text-anchor="middle" font-size="11" letter-spacing="3" fill="' + C.pink + '">SOLUCIÓN</text></g><g id="exsol" pointer-events="none"></g>';

    const wrap = makeSVG(svg);
    const el = wrap.querySelector("svg");
    const celdas = [...el.querySelectorAll(".exl")];
    const mov = el.querySelector("#exmov");
    // Solución: prueba las 32 combinaciones de la fila de arriba y persigue las luces
    function solucion() {
      let mejor = null;
      for (let m = 0; m < 32; m++) {
        const a = b.slice(), pr = [];
        for (let x = 0; x < N; x++) if (m >> x & 1) { pulsa(a, x); pr.push(x); }
        for (let y = 1; y < N; y++) for (let x = 0; x < N; x++) if (a[(y - 1) * N + x]) { pulsa(a, y * N + x); pr.push(y * N + x); }
        if (a.every((v) => !v) && (!mejor || pr.length < mejor.length)) mejor = pr;
      }
      return mejor || [];
    }
    function muestraSolucion() {
      let t = "";
      solucion().forEach((i, k) => {
        const x = BX + (i % N) * (S + G) + S / 2, y = BY + ((i / N) | 0) * (S + G) + S / 2;
        t += '<circle cx="' + x + '" cy="' + y + '" r="14" fill="' + C.deep + '" stroke="' + C.cream + '" stroke-width="2"/><text x="' + x + '" y="' + (y + 5) + '" text-anchor="middle" font-size="14" fill="' + C.cream + '">' + (k + 1) + "</text>";
      });
      el.querySelector("#exsol").innerHTML = t;
    }
    function pinta() {
      el.querySelector("#exsol").innerHTML = "";
      celdas.forEach((c, i) => c.setAttribute("fill", b[i] ? C.pink : C.night3));
      mov.textContent = "MOVIMIENTOS " + movs;
      wrap.dataset.luces = b.join("");
    }
    el.addEventListener("pointerdown", (e) => {
      if (hecho) return;
      const i = tocado(e);
      if (i < 0) return;
      if (i === 98) { muestraSolucion(); Sonido.play("hint"); return; }
      if (i === 99) { b = inicio.slice(); movs = 0; Sonido.play("papel"); pinta(); return; }
      pulsa(b, i); movs++; Sonido.play("tick"); pinta();
      if (b.every((v) => !v)) {
        hecho = true; Sonido.play("sello");
        el.querySelector("#exsub").textContent = "TODO APAGADO";
        setTimeout(() => vivo && resolver(), 1300);
      }
    });
    pinta();
    return { el: wrap, resuelto: ok, alEntrar() { UI.say("Las lámparas de la oficina están todas prendidas.", 4200); }, destruir() { vivo = false; } };
  }
};

// ===================================================================
// EXTRA 2 · SELLOS (sala 2) · orden secreto de cuatro sellos
// ===================================================================
const Extra2 = {
  pistas: [
    "Hay un orden secreto de cuatro sellos de colores. Ningún color se repite. Armá una combinación y tocá ENVIAR.",
    "Círculo lleno: un sello es correcto y está en su lugar. Círculo vacío: el sello existe en el orden, pero en otro lugar.",
    "Probá dos colores nuevos en cada intento y fijate cuántos círculos suma cada cambio. Si un intento no suma ningún círculo, esos colores no están."
  ],
  construir() {
    const COL = [C.pink, C.amber, C.blue, C.cream, "#7aa77c", "#8e6aa8"];
    const MAXI = 10;
    function secretoNuevo() {
      const a = [0, 1, 2, 3, 4, 5];
      for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; }
      return a.slice(0, 4);
    }
    let secreto = secretoNuevo(), hist = [], cur = [], hecho = false, vivo = true, resolver;
    const ok = new Promise((r) => (resolver = r));

    let svg = fondoCierre(902) + cabeceraExtra("EL ORDEN DE LOS SELLOS", "ADIVINÁ LA COMBINACIÓN");
    svg += '<rect x="22" y="118" width="316" height="388" rx="8" fill="' + C.night + '" stroke="#2a2030" stroke-width="2"/><g id="exmm"></g>';
    svg += '<text x="180" y="524" text-anchor="middle" font-size="9" letter-spacing="2" fill="' + C.cream2 + '">LLENO: LUGAR Y COLOR   ·   VACÍO: SOLO COLOR</text>';
    for (let k = 0; k < 6; k++) {
      svg += '<circle data-i="' + k + '" cx="' + (60 + k * 48) + '" cy="556" r="18" fill="' + COL[k] + '" stroke="#2a2030" stroke-width="2"/>';
    }
    svg += '<g data-i="10"><rect x="60" y="586" width="110" height="38" rx="6" fill="' + C.deep + '" stroke="' + C.pink + '" stroke-width="1.5"/>' +
      '<text x="115" y="610" text-anchor="middle" font-size="12" letter-spacing="4" fill="' + C.pink + '">ENVIAR</text></g>' +
      '<g data-i="11"><rect x="190" y="586" width="110" height="38" rx="6" fill="none" stroke="' + C.cream2 + '" stroke-width="1.5"/>' +
      '<text x="245" y="610" text-anchor="middle" font-size="12" letter-spacing="4" fill="' + C.cream2 + '">BORRAR</text></g>';

    const wrap = makeSVG(svg);
    const el = wrap.querySelector("svg");
    const mm = el.querySelector("#exmm");
    wrap.dataset.secreto = secreto.join(",");

    function fila(r, g, fb) {
      const y = 128 + r * 36;
      let s = "";
      for (let k = 0; k < 4; k++) {
        const v = g[k];
        s += '<circle cx="' + (52 + k * 44) + '" cy="' + (y + 16) + '" r="15" fill="' + (v === undefined ? "none" : COL[v]) + '" stroke="' + (v === undefined ? C.night3 : "#2a2030") + '" stroke-width="2"/>';
      }
      if (fb) {
        for (let k = 0; k < 4; k++) {
          const cx = 250 + (k % 2) * 18, cy = y + 8 + ((k / 2) | 0) * 16;
          if (k < fb.n) s += '<circle cx="' + cx + '" cy="' + cy + '" r="6" fill="' + C.cream + '"/>';
          else if (k < fb.n + fb.b) s += '<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="none" stroke="' + C.cream + '" stroke-width="1.8"/>';
          else s += '<circle cx="' + cx + '" cy="' + cy + '" r="2" fill="' + C.night3 + '"/>';
        }
      }
      return s;
    }
    function pinta() {
      let s = "";
      hist.forEach((h, r) => (s += fila(r, h.g, h)));
      if (!hecho && hist.length < MAXI) s += fila(hist.length, cur, null);
      mm.innerHTML = s;
      wrap.dataset.intentos = hist.length;
    }
    el.addEventListener("pointerdown", (e) => {
      if (hecho) return;
      const i = tocado(e);
      if (i < 0) return;
      if (i < 6) {
        if (cur.length >= 4 || cur.includes(i)) { if (cur.includes(i)) Sonido.play("error"); return; }
        cur.push(i); Sonido.play("tap"); pinta(); return;
      }
      if (i === 11) { cur.pop(); Sonido.play("papel"); pinta(); return; }
      if (i === 10) {
        if (cur.length < 4) { Sonido.play("error"); return; }

  construir() {
    const R = 6, Cn = 5, T = 56, X0 = 40, Y0 = 170;
    const N = 1, E = 2, S = 4, W = 8;
    const rotar = (m) => ((m << 1) | (m >> 3)) & 15;

    const pasos = [].concat(Array(Cn - 1).fill("E"), Array(R - 1).fill("S"));
    for (let i = pasos.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [pasos[i], pasos[j]] = [pasos[j], pasos[i]]; }
    const objetivo = new Array(R * Cn).fill(0), camino = [];

      objetivo[r * Cn + c] = antes | (sig === "E" ? E : S);
      camino.push(r * Cn + c);

    const ok = new Promise((rr) => (resolver = rr));

    let svg = fondoCierre(910) + cabeceraExtra("EL TUBO NEUMÁTICO", "CONECTÁ ENTRADA Y SALIDA") +

      if (k < 0 || k > 3) return;
      arrastre = k; try { el.setPointerCapture(e.pointerId); } catch (x) {}
      valor[k] = aValor(e); pinta(true);
    });
    el.addEventListener("pointermove", (e) => {
      if (arrastre < 0 || hecho) return;
      const k = arrastre, antes = valor[k];
      valor[k] = aValor(e);
      if (k === orden[fijado] && Math.abs(valor[k] - objetivo[k]) <= CAL && Math.abs(antes - objetivo[k]) > CAL) Sonido.play("tick");
      pinta(true);
    });
    function suelta() {
      if (arrastre < 0 || hecho) return;
      const k = arrastre; arrastre = -1;
      if (k === orden[fijado] && Math.abs(valor[k] - objetivo[k]) <= TOL) {
        fijado++; Sonido.play("candado");
        if (fijado === 4) {
          hecho = true; Sonido.play("sello"); el.querySelector("#exsub").textContent = "CAJA ABIERTA"; pinta(false);
          setTimeout(() => vivo && resolver(), 1400); return;
        }
      } else { valor[k] = 0; if (k === orden[fijado]) Sonido.play("error"); else Sonido.play("papel"); }
      pinta(false);
    }
    el.addEventListener("pointerup", suelta);
    el.addEventListener("pointercancel", suelta);
    pinta(false);
    return { el: wrap, resuelto: ok, alEntrar() { UI.say("Una caja fuerte. No hay llave, pero sí unas ganzúas.", 4200); }, destruir() { vivo = false; } };
  }
};

// Por sala: [extra A, extra B]
const EXTRAS = [[Extra9, Extra11], [Extra2, Extra6], [Extra3, Extra7], [Extra8]];

</script>
<script>
/*
 ////////////////////////////////////////////////////////////////////
 ///////////////////  ESCENA FINAL (EL CÓDIGO)  /////////////////////
 ////////////////////////////////////////////////////////////////////
 Es el único lugar donde el código completo aparece en pantalla, y solo
 después de haber resuelto las cuatro salas.
*/

const Final = {

  construir() {
    const cx = 190;                // centro de la caja
    const n = CONFIG.CODIGO.length;
    const anchoCelda = 54, sep = 12;
    const total = n * anchoCelda + (n - 1) * sep;
    const x0 = 180 - total / 2;

    let svg = "";
    svg += '<rect x="-80" y="-20" width="520" height="780" fill="' + C.night + '"/>';

    // Haz de luz y halos planos
    svg += '<polygon points="148,-20 212,-20 330,540 30,540" fill="' + C.pink + '" opacity=".06"/>' +
           '<circle cx="' + cx + '" cy="470" r="230" fill="' + C.pink + '" opacity=".04"/>' +
           '<circle cx="' + cx + '" cy="470" r="165" fill="' + C.pink + '" opacity=".05"/>' +
           '<circle cx="' + cx + '" cy="470" r="105" fill="' + C.pink + '" opacity=".06"/>';

    // Estrellas pequeñas arriba
    [[40,130],[310,110],[270,170],[70,190],[330,220],[24,260]].forEach((p, i) => {
      svg += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (1 + (i % 2)) + '" fill="' + C.pinkPl + '" opacity=".6"/>';
    });

    // Mesa
    svg += '<g filter="url(#mano)"><rect x="-80" y="540" width="520" height="260" fill="' + C.wood2 + '"/><rect x="-80" y="540" width="520" height="5" fill="' + C.wood3 + '"/>' +
           vetas(-60, 550, 500, 150, 8, "#2a2030", 0.38, 81) + anillo(70, 580, 18, 5, C.kraftDk, 0.5) + "</g>";

    // Caja física
    svg += '<g id="fbox" filter="url(#mano)">' +
      '<rect x="' + (cx - 88) + '" y="448" width="176" height="92" fill="' + C.kraft + '"/>' +
      '<rect x="' + (cx - 88) + '" y="448" width="176" height="8" fill="' + C.kraftDk + '"/>' +
      '<rect x="' + (cx - 96) + '" y="420" width="192" height="32" fill="' + C.wood3 + '"/>' +
      '<rect x="' + (cx - 96) + '" y="420" width="192" height="5" fill="' + C.cream2 + '" opacity=".3"/>' +
      '<rect x="' + (cx - 7) + '" y="420" width="14" height="120" fill="' + C.pink + '"/>' +
      // candado
      '<g id="fpad">' +
        '<path id="fshackle" d="M' + (cx - 10) + ' 452 v-16 a10 10 0 0 1 20 0 v16" fill="none" stroke="' + C.amber + '" stroke-width="5" style="transition:transform 1.2s cubic-bezier(.3,.7,.2,1)"/>' +
        '<rect x="' + (cx - 17) + '" y="450" width="34" height="28" rx="4" fill="' + C.amber + '"/>' +
        '<circle cx="' + cx + '" cy="461" r="4" fill="' + C.amberDk + '"/><rect x="' + (cx - 1.5) + '" y="461" width="3" height="10" fill="' + C.amberDk + '"/>' +
      '</g>' +
      '</g>';

    // Polvo flotando
    svg += '<g class="dust" fill="' + C.pinkPl + '">';
    for (let i = 0; i < 9; i++) {
      const x = 60 + i * 30 + (i % 3) * 7, y = 520 - (i % 4) * 14, d = 5 + (i % 4) * 1.6, dl = -(i * 0.9);
      svg += '<circle cx="' + x + '" cy="' + y + '" r="' + (1.2 + (i % 3) * 0.5) + '" style="animation-duration:' + d + "s;animation-delay:" + dl + 's"/>';
    }
    svg += "</g>";

    // Foto opcional (solo si el archivo existe)
    svg += '<g id="ffoto"></g>';

    // Celdas del código (vacías hasta el momento de revelar)
    svg += '<g id="fcode" transform="translate(0 270)">';
    for (let i = 0; i < n; i++) {
      svg += '<g class="fcell" data-i="' + i + '" style="transform-origin:' + (x0 + i * (anchoCelda + sep) + anchoCelda / 2) + 'px 35px;transition:transform .5s cubic-bezier(.2,1.5,.4,1)">' +
        '<rect x="' + (x0 + i * (anchoCelda + sep)) + '" y="0" width="' + anchoCelda + '" height="70" rx="4" fill="' + C.night2 + '" stroke="' + C.pink + '" stroke-width="2" opacity=".0" class="fbg" style="transition:opacity .6s"/>' +
        '<text class="ftxt" x="' + (x0 + i * (anchoCelda + sep) + anchoCelda / 2) + '" y="52" text-anchor="middle" font-size="44" font-weight="bold" fill="' + C.pinkPl + '"></text>' +
        "</g>";
    }
    svg += "</g>";

    const wrap = makeSVG(svg);
    const el = wrap.querySelector("svg");

    // Foto final (opcional)
    const foto = new Image();
    foto.onload = () => {
      el.querySelector("#ffoto").innerHTML =
        '<g transform="rotate(-7 52 520)"><rect x="14" y="456" width="82" height="96" fill="' + C.cream + '"/>' +
        '<image href="' + CONFIG.FOTOS.final + '" x="19" y="461" width="72" height="72" preserveAspectRatio="xMidYMid slice"/></g>';
    };
    foto.src = CONFIG.FOTOS.final;

    // Texto narrado (HTML por encima de la escena)
    const texto = h("div", "final-text");
    const firma = h("div", "final-firma");
    wrap.appendChild(texto); wrap.appendChild(firma);

    return { el: wrap, svg: el, texto, firma, n };
  },

  // Secuencia cinematográfica completa
  async reproducir(esc) {
    const F = CONFIG.TEXTOS.final.map(fill);
    const antes = F.slice(0, 2), despues = F.slice(2);
    const skip = esc.el;

    const decir = async (t, pausa) => {
      await typeInto(esc.texto, t, 48, skip);
      await sleep((pausa || 1800) + 900);
    };

    await sleep(1400);
    Sonido.play("puerta");
    for (const t of antes) await decir(t, 1700);

    // Revelar el código, dígito por dígito
    esc.svg.querySelectorAll(".fbg").forEach((r) => (r.style.opacity = "1"));
    await sleep(700);
    const celdas = esc.svg.querySelectorAll(".fcell");
    for (let i = 0; i < celdas.length; i++) {
      celdas[i].querySelector(".ftxt").textContent = CONFIG.CODIGO[i];
      celdas[i].style.transform = "scale(1.25)";
      Sonido.play("candado");
      await sleep(120);
      celdas[i].style.transform = "scale(1)";
      await sleep(850);
    }
    await sleep(500);
    Sonido.play("final");
    esc.svg.querySelector("#fshackle").style.transform = "translateY(-9px)";
    await sleep(2400);

    for (let i = 0; i < despues.length; i++) {
      const ultimo = i === despues.length - 1;
      await decir(despues[i], ultimo ? 600 : 2200);
    }
    if (CONFIG.FIRMA) {
      esc.firma.textContent = "— " + CONFIG.FIRMA;
      esc.firma.classList.add("on");
    }
  }
};

</script>
<script>
/*
 ////////////////////////////////////////////////////////////////////
 //////////////  FLUJO PRINCIPAL: PORTADA → SALAS → FINAL  //////////
 ////////////////////////////////////////////////////////////////////
*/

const SALAS = [Sala1, Sala2, Sala3, Sala4];

// ===================================================================
// PORTADA
// ===================================================================
function portada() {
  return new Promise((resolve) => {
    const st = State.get();
    const hayProgreso = st.iniciado || st.resueltas.some(Boolean);

    let lluvia = "";
    for (let i = 0; i < 46; i++) {
      const x = Math.round(Math.random() * 380 - 10), y = Math.round(Math.random() * 720);
      const d = (0.55 + Math.random() * 0.6).toFixed(2), dl = (-Math.random() * 2).toFixed(2);
      lluvia += '<line x1="' + x + '" y1="' + y + '" x2="' + (x - 2) + '" y2="' + (y + 12) + '" style="animation-duration:' + d + "s;animation-delay:" + dl + 's"/>';
    }

    // Ciudad al fondo: edificios planos con ventanas encendidas
    let ciudad = "";
    const edif = [[-10,70,46],[40,110,36],[82,84,40],[128,128,34],[168,96,44],[216,120,38],[258,80,42],[304,104,44]];
    edif.forEach((e, i) => {
      ciudad += '<rect x="' + e[0] + '" y="' + (720 - e[1]) + '" width="' + e[2] + '" height="' + e[1] + '" fill="' + (i % 2 ? C.night2 : "#1f2640") + '"/>';
      for (let w = 0; w < 5; w++) {
        if ((i * 7 + w * 3) % 4 === 0) ciudad += '<rect x="' + (e[0] + 8 + (w % 2) * 14) + '" y="' + (720 - e[1] + 12 + w * 16) + '" width="5" height="6" fill="' + C.amber + '" opacity=".8"/>';
      }
    });
    const sobre =
      '<svg class="cover-env" viewBox="0 0 96 70" width="96" height="70">' +
      '<rect x="2" y="6" width="92" height="60" rx="3" fill="' + C.cream + '"/>' +
      '<path d="M2 9 L48 40 L94 9" fill="none" stroke="' + C.cream2 + '" stroke-width="3" stroke-linejoin="round"/>' +
      '<circle cx="48" cy="40" r="9" fill="' + C.pink + '"/><circle cx="48" cy="40" r="4.5" fill="none" stroke="' + C.pinkDk + '" stroke-width="1.5"/></svg>';

    const cover = h("div", "cover",
      '<svg class="rain-bg" viewBox="0 0 360 720" preserveAspectRatio="xMidYMid slice"><g>' + ciudad + '</g><g class="rain">' + lluvia + "</g></svg>" +
      sobre +
      '<div class="k"></div><div class="line"></div><h1></h1><div class="note"></div>' +
      '<button class="btn">' + (hayProgreso ? "Continuar" : "Entrar") + "</button>");
    cover.querySelector(".k").textContent = fill(CONFIG.TEXTOS.portadaKicker);
    cover.querySelector("h1").textContent = CONFIG.TEXTOS.portadaTitulo;
    cover.querySelector(".note").textContent = CONFIG.TEXTOS.portadaNota;

    const wrap = h("div", "scene");
    wrap.appendChild(cover);
    UI.showScene(wrap);
    cover.querySelector("button").addEventListener("click", () => {
      Sonido.init();            // el audio solo puede arrancar con un toque
      Sonido.play("tap");
      resolve();
    });
  });
}

// ===================================================================
// INTRODUCCIÓN (solo la primera vez)
// ===================================================================
async function introduccion() {
  UI.bars(true);
  const wrap = h("div", "scene",
    '<div class="intro-wrap"><div class="intro-text"></div><div class="intro-sub">Tocá para continuar</div><button class="btn">Empezar</button></div>');
  UI.showScene(wrap);
  const box = wrap.querySelector(".intro-wrap");
  const txt = wrap.querySelector(".intro-text");
  const sub = wrap.querySelector(".intro-sub");
  const btn = wrap.querySelector("button");
  const lineas = CONFIG.TEXTOS.intro.map(fill);

  await sleep(1500);
  for (let i = 0; i < lineas.length; i++) {
    sub.classList.remove("on");
    await typeInto(txt, lineas[i], 52, box);
    await sleep(1100);
    if (i < lineas.length - 1) {
      sub.classList.add("on");
      await waitTap(box);
    }
  }
  btn.classList.add("on");
  await new Promise((r) => btn.addEventListener("click", () => { Sonido.play("tap"); r(); }));
  State.set("iniciado", true);
}

// ===================================================================
// UNA SALA
// ===================================================================
async function jugarSala(i) {
  const S = SALAS[i];
  // Fácil: 2 desafíos por sala. Difícil: 3 (el tercero es nuevo).
  const pasos = [S, PASOS2[i]].concat(CONFIG.DIFICIL ? EXTRAS[i] : []);
  UI.hudShow(false);
  UI.hush();
  let k = Math.min(State.paso(i), pasos.length - 1);   // retoma donde quedó
  let sala = pasos[k].construir();

  await UI.titleCard(S.kicker, S.titulo, () => {
    UI.bars(false);
    UI.showScene(sala.el);
    Sonido.setRainMuffle(false);
  });
  UI.hudShow(true);
  UI.updateTray();

  let primero = true;
  for (; k < pasos.length; k++) {
    if (!primero) {                         // transición entre desafíos
      await UI.fade(true, 700);
      sala = pasos[k].construir();
      UI.showScene(sala.el);
      await UI.fade(false, 900);
    }
    primero = false;
    UI.setupHints(i * 4 + k, pasos[k].pistas);
    sala.alEntrar();
    await sala.resuelto;                    // no avanza hasta resolver la prueba
    UI.stopHints();
    sala.destruir();
    if (k < pasos.length - 1) { State.setPaso(i, k + 1); Sonido.play("chime"); }
  }

  State.resolver(i);                        // el progreso queda guardado
  Sonido.play("chime");
  await sleep(900);
  await UI.cartaSube();
  const txt = fill(CONFIG.TEXTOS.cartas[i]);
  await UI.card("Carta del cartero", txt, 2500 + txt.replace(/<[^>]*>/g, "").length * 45);
  await sleep(300);
  if (i < CONFIG.CODIGO.length) await UI.revealDigit(i, CONFIG.CODIGO[i], i === 2 ? CONFIG.FOTOS.sala3 : (i === 0 ? CONFIG.FOTOS.sala1 : undefined));
}

// ===================================================================
// FINAL
// ===================================================================
async function finale() {
  UI.hudShow(false);
  UI.stopHints();
  UI.hush();
  UI.bars(true);
  await UI.fade(true, 1600);
  const esc = Final.construir();
  UI.showScene(esc.el);
  await UI.fade(false, 2200);
  State.set("terminado", true);
  await Final.reproducir(esc);
}

// ===================================================================
// ARRANQUE
// ===================================================================
async function main() {
  UI.mount();
  prepararDev();
  await portada();

  const st = State.get();
  if (st.terminado) {
    await finale();
    return;
  }
  if (!st.iniciado && !st.resueltas.some(Boolean)) {
    await introduccion();
  }
  for (let i = State.salaActual(); i < SALAS.length; i++) {
    await jugarSala(i);
  }
  await finale();
}

// ===================================================================
// PANEL DE PRUEBAS: se abre agregando #dev al final del enlace.
// Sirve para probar salas sueltas y borrar el progreso.
// ===================================================================
function prepararDev() {
  if (location.hash !== "#dev") return;
  const d = document.getElementById("dev");
  d.classList.remove("hidden");
  const mk = (txt, fn) => { const b = h("button", "", txt); b.addEventListener("click", fn); d.appendChild(b); };
  const ir = (hasta, terminado) => {
    State.reset();
    for (let k = 0; k < hasta; k++) State.resolver(k);
    State.set("iniciado", true);
    State.set("terminado", !!terminado);
    location.reload();
  };
  mk("Sala 1", () => ir(0));
  mk("Sala 2", () => ir(1));
  mk("Sala 3", () => ir(2));
  mk("Sala 4", () => ir(3));
  mk("Final", () => ir(4));
  [0, 1, 2, 3].forEach((k) => mk("Paso 2 · S" + (k + 1), () => { ir(k); State.setPaso(k, 1); location.reload(); }));
  if (CONFIG.DIFICIL) [0, 1, 2, 3].forEach((k) => mk("Paso 3 · S" + (k + 1), () => { ir(k); State.setPaso(k, 2); location.reload(); }));
  if (CONFIG.DIFICIL) [0, 1, 2, 3].forEach((k) => mk("Paso 4 · S" + (k + 1), () => { ir(k); State.setPaso(k, 3); location.reload(); }));
  mk("Reiniciar todo", () => { State.reset(); State.set("iniciado", false); location.reload(); });
}

main();

</script>
