    }
    svg += '</g></svg>' +
      '<rect x="178" y="104" width="4" height="162" fill="' + C.cream2 + '"/><rect x="110" y="182" width="140" height="4" fill="' + C.cream2 + '"/>' +
      '</g>';

    // Calendario
    svg += '<g id="s1cal" class="tappable" filter="url(#mano)">' +
      '<rect x="26" y="112" width="62" height="80" rx="2" fill="' + C.cream + '"/>' +
      '<rect x="26" y="112" width="62" height="20" rx="2" fill="' + C.pink + '"/>' +
      '<text x="57" y="127" text-anchor="middle" font-size="11" letter-spacing="2" fill="' + C.night + '">NOV</text>' +
      '<text x="57" y="170" text-anchor="middle" font-size="30" font-weight="bold" fill="' + C.night + '">28</text>' +
      '<ellipse cx="57" cy="161" rx="22" ry="17" fill="none" stroke="' + C.pinkDk + '" stroke-width="2.4" transform="rotate(-8 57 161)"/>' +
      '<circle cx="57" cy="108" r="3" fill="' + C.cream2 + '"/>' +
      '</g>';

    // Nota pegada
    svg += '<g id="s1note" class="tappable" filter="url(#mano)">' +
      '<g transform="rotate(4 300 150)"><rect x="272" y="116" width="58" height="68" fill="' + C.cream + '"/>' +
      '<rect x="288" y="108" width="26" height="12" fill="' + C.pinkPl + '" opacity=".85"/>' +
      '<g fill="' + C.night3 + '"><rect x="280" y="134" width="40" height="2"/><rect x="280" y="144" width="34" height="2"/><rect x="280" y="154" width="40" height="2"/><rect x="280" y="164" width="26" height="2"/></g></g>' +
      '</g>';

    // Estante con libros
    const libros = [[28,262,16,56,C.pink],[46,272,14,46,C.cream2],[62,258,18,60,C.blue],[82,270,12,48,C.amber],[96,264,16,54,C.pinkDk]];
    svg += '<g filter="url(#mano)">';
    libros.forEach((b) => { svg += '<rect x="' + b[0] + '" y="' + b[1] + '" width="' + b[2] + '" height="' + b[3] + '" fill="' + b[4] + '"/>'; });
    svg += '<rect x="280" y="288" width="34" height="30" rx="3" fill="' + C.wood3 + '"/>' +
      '<path d="M297 288 C285 270 282 258 288 246 C296 258 298 270 297 288 Z" fill="#5f8a78"/>' +
      '<path d="M297 288 C306 272 314 264 322 262 C318 274 308 284 297 288 Z" fill="#7aa592"/>' + "</g>";

    // Escritorio
    svg += '<g filter="url(#mano)"><rect x="-80" y="470" width="520" height="30" fill="' + C.wood3 + '"/>' +
      '<rect x="-80" y="470" width="520" height="4" fill="' + C.wood3 + '" opacity=".6"/>' +
      '<rect x="-80" y="500" width="520" height="260" fill="' + C.wood + '"/>' +
      '<rect x="-80" y="500" width="520" height="5" fill="' + C.wood2 + '"/>' +
      vetas(-60, 474, 500, 22, 6, "#2b2030", 0.4, 11) + vetas(-60, 508, 500, 200, 10, "#2a2030", 0.35, 12) +
      anillo(124, 487, 15, 4, C.kraftDk, 0.55) +
      '<polygon points="94,480 140,477 146,491 99,494" fill="' + C.cream + '" opacity=".9"/>' +
      '<path d="M101 484 q10 -3 20 0 M101 488 q12 -3 24 0" fill="none" stroke="' + C.night3 + '" stroke-width="1" opacity=".6"/>' +
      '<line x1="212" y1="489" x2="266" y2="483" stroke="' + C.amber + '" stroke-width="4" stroke-linecap="round"/>' +
      '<polygon points="266,481 274,482 266,485" fill="' + C.cream2 + '"/>' +
      "</g>";

    // Luz de la lámpara sobre el escritorio (plano translúcido)
    svg += '<polygon points="76,392 136,392 206,470 22,470" fill="' + C.amber + '" opacity=".13"/>';

    // Lámpara
    svg += '<g id="s1lamp" class="tappable" filter="url(#mano)">' +
      '<ellipse cx="62" cy="468" rx="26" ry="6" fill="' + C.night3 + '"/>' +
      '<rect x="56" y="440" width="12" height="28" fill="' + C.night3 + '"/>' +
      '<polyline points="62,440 62,404 98,376" fill="none" stroke="' + C.night3 + '" stroke-width="5" stroke-linejoin="round"/>' +
      '<polygon points="80,350 128,366 118,396 70,380" fill="' + C.amber + '"/>' +
      '<polygon points="70,380 118,396 116,402 68,386" fill="' + C.amberDk + '"/>' +
      '</g>';

    // Taza
    svg += '<g id="s1cup" class="tappable" filter="url(#mano)">' +
      '<ellipse cx="186" cy="470" rx="30" ry="6" fill="' + C.cream2 + '"/>' +
      '<path d="M166 436 H206 V454 Q206 470 186 470 Q166 470 166 454 Z" fill="' + C.cream + '"/>' +
      '<rect x="166" y="442" width="40" height="6" fill="' + C.pink + '"/>' +
      '<path d="M206 442 q16 0 16 12 q0 12 -16 12" fill="none" stroke="' + C.cream + '" stroke-width="4"/>' +
      '<g class="steam" fill="none" stroke="' + C.cream2 + '" stroke-width="2" stroke-linecap="round"><path d="M180 430 q-6 -8 0 -16"/><path d="M192 428 q6 -8 0 -16"/></g>' +
      '</g>';

    // Bolsa de papel
    svg += '<g id="s1bag" class="tappable" filter="url(#mano)">' +
      '<rect x="234" y="410" width="60" height="60" fill="' + C.kraft + '"/>' +
      '<polygon points="294,410 306,418 306,470 294,470" fill="' + C.kraftDk + '"/>' +
      '<polygon points="234,410 240,402 288,402 294,410" fill="' + C.kraftDk + '"/>' +
      '<rect x="242" y="420" width="44" height="26" fill="' + C.cream + '"/>' +
      '<text x="264" y="431" text-anchor="middle" font-size="7.5" font-weight="bold" fill="' + C.night + '">LOMITO</text>' +
      '<text x="264" y="441" text-anchor="middle" font-size="7.5" font-weight="bold" fill="' + C.pinkDk + '">ÁRABE</text>' +
      '</g>';

    // Paquete sellado
    svg += '<g id="s1parcel" class="tappable" filter="url(#mano)">' +
      '<rect x="312" y="430" width="40" height="40" fill="' + C.kraft + '"/>' +
      '<rect x="329" y="430" width="6" height="40" fill="' + C.pink + '"/><rect x="312" y="446" width="40" height="6" fill="' + C.pink + '"/>' +
      '<rect x="316" y="456" width="26" height="12" fill="' + C.cream + '"/>' +
      '<text x="329" y="465" text-anchor="middle" font-size="6.5" font-weight="bold" fill="' + C.night + '">SOFÍA</text>' +
      '</g>';

    // Frente del escritorio con cajón
    svg += '<g id="s1drawer">' +
      '<rect x="46" y="536" width="268" height="140" rx="5" fill="#2a2030"/>' +
      '<g id="s1face">' +
      '<rect x="46" y="536" width="268" height="140" rx="5" fill="' + C.wood2 + '" stroke="#2e2230" stroke-width="2"/>' +
      '<rect x="150" y="548" width="60" height="7" rx="3.5" fill="' + C.cream2 + '"/>';
    // Cuatro botones con símbolos (orden mezclado)
    const botones = [["corazon", 92], ["luna", 150], ["llave", 210], ["estrella", 268]];
    botones.forEach((b) => {
      svg += '<g class="tappable s1btn" data-sym="' + b[0] + '">' +
        '<circle class="s1btnbg" cx="' + b[1] + '" cy="612" r="23" fill="' + C.night3 + '" stroke="' + C.cream2 + '" stroke-width="1.5"/>' +
        simbolo(b[0], b[1], 612, 0.9, C.cream, 'class="s1btnsym" stroke-width="0.6"') +
        "</g>";
    });
    svg += '</g></g>';

    // Capa de oscurecimiento con agujero para la luz
    svg += '<rect id="s1dim" x="-80" y="-20" width="520" height="780" fill="' + C.deep + '" opacity=".30" mask="url(#s1mask)" pointer-events="none"/>';

    // Marcas ocultas, visibles solo dentro de la luz
    svg += '<g id="s1uv" clip-path="url(#s1clip)" pointer-events="none">' +
      '<rect x="-80" y="-20" width="520" height="780" fill="' + C.uv + '" opacity=".16"/>' +
      simbolo("luna",     100, 372, 0.95, C.uv, 'stroke-width="0"') +
      simbolo("estrella", 186, 456, 0.78, C.uv, 'stroke-width="0"') +
      simbolo("corazon",  264, 458, 0.62, C.uv, 'stroke-width="0"') +
      simbolo("llave",    330, 440, 0.55, C.uv, 'stroke-width="0.6"') +
      '</g>';

    // Anillo de la luz
    svg += '<g id="s1lens" pointer-events="none">' +
      '<circle id="s1ring" cx="180" cy="430" r="' + R + '" fill="none" stroke="' + C.uv + '" stroke-width="2"/>' +
      '<circle id="s1ring2" cx="180" cy="430" r="' + (R + 7) + '" fill="none" stroke="' + C.uv + '" stroke-width="1" opacity=".35"/>' +
      '</g>';

    // Indicador inicial
    svg += '<text id="s1hint" x="180" y="352" text-anchor="middle" font-size="11" letter-spacing="3" fill="' + C.uv + '" class="pulse-soft" pointer-events="none">ARRASTRÁ LA LUZ</text>';

    const wrap = makeSVG(svg);
    const el = wrap.querySelector("svg");
    const $ = (id) => el.querySelector("#" + id);

    // ---------- Luz UV ----------
    let moved = false;
    function moverLuz(cx, cy) {
      ["s1clipc", "s1maskc", "s1ring", "s1ring2"].forEach((id) => { $(id).setAttribute("cx", cx); $(id).setAttribute("cy", cy); });
    }
    let arrastrando = false;
    // Distancia recorrida por el dedo: si arrastró la luz, no cuenta como "toque" sobre un objeto
    let recorrido = 0, ultimo = null;
    el.addEventListener("pointerdown", (e) => {
      recorrido = 0; ultimo = { x: e.clientX, y: e.clientY };
      // Si se toca un objeto o el cajón, no mover la luz
      if (e.target.closest(".tappable")) return;
      arrastrando = true;
      el.setPointerCapture(e.pointerId);
      mover(e);
    });
    el.addEventListener("pointermove", (e) => {
      if (ultimo) { recorrido += Math.abs(e.clientX - ultimo.x) + Math.abs(e.clientY - ultimo.y); ultimo = { x: e.clientX, y: e.clientY }; }
      if (arrastrando) mover(e);
    });
    el.addEventListener("pointerup",    () => { arrastrando = false; });
    el.addEventListener("pointercancel",() => { arrastrando = false; });
    function mover(e) {
      const p = svgPoint(el, e.clientX, e.clientY);
      const dy = e.pointerType === "mouse" ? 0 : 52; // en dedo, la luz va arriba para no taparla
      moverLuz(clamp(p.x, 10, 350), clamp(p.y - dy, 80, 690));
      if (!moved) {
        moved = true;
        $("s1hint").style.display = "none";
        Sonido.play("sube");
      }
    }
    // También se puede mover tocando y arrastrando sobre objetos (la luz sigue al dedo)
    el.addEventListener("pointermove", (e) => {
      if (!arrastrando && e.buttons === 1) mover(e);
    });

    // ---------- Objetos examinables ----------
    let cardAbierta = false;
    async function examinar(titulo, html) {
      if (cardAbierta) return;
      cardAbierta = true;
      await UI.card(titulo, html);
      cardAbierta = false;
    }
    const onTap = (id, f) => { $(id).addEventListener("click", () => { if (recorrido < 14) f(); }); };

    onTap("s1lamp",   () => examinar("La lámpara", "Una lámpara de escritorio. Su luz es cálida, casi de otra época. Alguien la dejó encendida a propósito."));
    onTap("s1cup",    () => examinar("La taza", "Una taza con un resto de té todavía tibio. Quien la usó se fue hace poco."));
    onTap("s1bag",    () => examinar("La bolsa", "Una bolsa de papel que todavía huele a lomito árabe. El cartero tenía buen gusto."));
    onTap("s1cal",    () => examinar("El calendario", "Noviembre. El día 28 está marcado con un círculo, repasado tantas veces que la tinta se corrió."));
    onTap("s1window", () => examinar("La ventana", "Llueve desde hace horas. La ciudad está quieta y las luces se ven a lo lejos."));
    onTap("s1note",   () => examinar("Nota del cartero",
      "«Lo que no pude entregar lo marqué con símbolos que solo se ven con luz especial.<br><br>" +
      "Para abrir el cajón, respetá el <b>orden de entrega</b>: primero lo que alumbra, después lo que se bebe, al final lo que se come.»"));
    onTap("s1parcel", () => {
      const n = CONFIG.CODIGO.length;
      let cajas = '<div class="cajas">';
      for (let i = 0; i < n; i++) cajas += "<span>" + (State.digitoGanado(i) ? CONFIG.CODIGO[i] : "") + "</span>";
      cajas += "</div>";
      examinar("El paquete", "Un paquete sellado, con destinataria. El sello se abre con una clave de " + n + " dígitos." + cajas);
    });

    // ---------- Cajón ----------
    let secuencia = [], bloqueado = false;
    const ok = new Promise((resolve) => {
      el.querySelectorAll(".s1btn").forEach((g) => {
        g.addEventListener("click", async () => {
          if (bloqueado || recorrido >= 14) return;
          const sym = g.dataset.sym;
          if (g.classList.contains("sel")) return;
          g.classList.add("sel");
          g.querySelector(".s1btnbg").setAttribute("fill", C.pink);
          g.querySelector(".s1btnsym").setAttribute("fill", C.night);
          g.querySelector(".s1btnsym").setAttribute("stroke", C.night);
          secuencia.push(sym);
          Sonido.play("tap");
          if (secuencia.length < Sala1.SOLUCION.length) return;
          bloqueado = true;
          await sleep(450);
          const correcto = secuencia.every((s, i) => s === Sala1.SOLUCION[i]);
          if (correcto) {
            // Cámara al cajón, el frente se abre y sale un sobre
            Sonido.play("candado");
            $("s1dim").style.opacity = "0";
            $("s1uv").style.display = "none"; $("s1lens").style.display = "none";
            const ph = el.querySelector("#s1hint"); if (ph) ph.style.display = "none";
            await sleep(500);
            await UI.zoomA(180, 600, 2.1, 1600, 0.62);
            const face = $("s1face");
            Sonido.play("cajon");
            await UI.mover(face, 14, 500);                       // primero cede un poco
            await sleep(150);
            await UI.mover(face, 96, 1700, 0);                   // y baja del todo
            await UI.emerger(180, 596);
            resolve();
          } else {
            Sonido.play("error");
            UI.shake(el.querySelector("#s1face"));
            UI.say("El cajón no cede. El orden no es ese.", 3200);
            await sleep(500);
            await UI.penalizar();
            secuencia = [];
            el.querySelectorAll(".s1btn").forEach((b) => {
              b.classList.remove("sel");
              b.querySelector(".s1btnbg").setAttribute("fill", C.night3);
              b.querySelector(".s1btnsym").setAttribute("fill", C.cream);
              b.querySelector(".s1btnsym").setAttribute("stroke", C.cream);
            });
            bloqueado = false;
          }
        });
      });
    });

    return {
      el: wrap,
      resuelto: ok,
      alEntrar() { UI.say("Una luz UV. El cartero la usaba para marcar lo importante.", 5200); },
      destruir() {}
    };
  }
};

</script>
<script>
/*
 ////////////////////////////////////////////////////////////////////
 ///////////////  SALA 2 · LA SALA DE SELLOS (LÓGICA)  //////////////
 ////////////////////////////////////////////////////////////////////
 Mecánica: cuatro sellos de colores y un registro con cuatro espacios.
 Tres reglas permiten deducir un único orden.
 Reglas:  1) El ámbar abre el registro (primero).
          2) El rosa va justo después del azul.
          3) El crema no cierra el registro (no va último).
 Solución: ámbar → crema → azul → rosa
*/

const Sala2 = {
  id: 1,
  kicker: "Sala 2",
  titulo: "La sala de sellos",
  pistas: [
    "Leé las tres reglas del registro. Una de ellas te dice exactamente cuál sello va primero.",
    "El ámbar va primero. El rosa tiene que ir justo después del azul, y el crema no puede quedar último.",
    "El orden es: ámbar, crema, azul, rosa."
  ],
  SOLUCION: ["amber", "cream", "blue", "pink"],

  construir() {
    const COLOR = { amber: C.amber, cream: C.cream, blue: C.blue, pink: C.pink };
    const NOMBRE = { amber: "ámbar", cream: "crema", blue: "azul", pink: "rosa" };
    const RACK_ORDEN = ["blue", "amber", "pink", "cream"];
    const SLOT_X = [34, 110, 186, 262];   // esquina izquierda de cada espacio
    const SLOT_Y = 396, SLOT_W = 64, SLOT_H = 60;
    const RACK_CX = [66, 142, 218, 294];

    // Icono grabado en cada sello (centrado en cx, cy)
    function icono(id, cx, cy, k) {
      k = k || 1;
      const t = 'transform="translate(' + cx + " " + cy + ") scale(" + k + ')"';
      if (id === "amber") {
        let rayos = "";
        for (let a = 0; a < 8; a++) rayos += '<rect x="-1.4" y="-14" width="2.8" height="6" transform="rotate(' + a * 45 + ')"/>';
        return '<g ' + t + ' fill="' + C.night + '"><circle r="6"/>' + rayos + "</g>";
      }
      if (id === "cream") return '<g ' + t + ' fill="' + C.night + '"><polygon points="0,-12 9,0 0,12 -9,0"/><polygon points="0,-5 4,0 0,5 -4,0" fill="' + C.cream + '"/></g>';
      if (id === "blue")  return '<g ' + t + ' fill="none" stroke="' + C.night + '" stroke-width="2.6" stroke-linecap="round"><path d="M-12 -5 q3 -5 6 0 t6 0 t6 0 t6 0"/><path d="M-12 4 q3 -5 6 0 t6 0 t6 0 t6 0"/></g>';
      return '<g ' + t + '><text y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="' + C.night + '">' + CONFIG.FECHA_NOVIOS + "</text></g>";
    }

    let svg = "";

    // Pared y casilleros
    svg += '<g filter="url(#mano)"><rect x="-80" y="-20" width="520" height="780" fill="' + C.night2 + '"/>' +
      mancha(300, 40, 30, C.night3, 0.35, 21) + mancha(30, 262, 24, C.night3, 0.3, 22) + vetas(-40, 10, 440, 50, 3, C.night3, 0.5, 23) + "</g>";
    svg += '<g id="s2wall" class="tappable" filter="url(#mano)">';
    svg += '<rect x="18" y="78" width="324" height="180" rx="3" fill="' + C.wood + '"/>';
    const sobres = { "0,1": C.cream, "0,3": C.pink, "1,0": C.pinkPl, "1,2": C.cream, "1,4": C.blue, "2,1": C.pink, "2,3": C.cream };
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 5; c++) {
        const x = 24 + c * 64, y = 84 + r * 58;
        svg += '<rect x="' + x + '" y="' + y + '" width="56" height="52" fill="' + C.deep + '"/>';
        svg += '<rect x="' + x + '" y="' + y + '" width="56" height="5" fill="#0a0e1c"/>';
        const col = sobres[r + "," + c];
        if (col) {
          svg += '<g transform="rotate(' + ((r + c) % 3 - 1) * 3 + " " + (x + 28) + " " + (y + 40) + ')">' +
            '<rect x="' + (x + 8) + '" y="' + (y + 22) + '" width="40" height="30" fill="' + col + '"/>' +
            '<polygon points="' + (x + 8) + "," + (y + 22) + " " + (x + 48) + "," + (y + 22) + " " + (x + 28) + "," + (y + 38) + '" fill="' + C.night + '" opacity=".18"/></g>';
        }
        svg += '<rect x="' + (x + 12) + '" y="' + (y + 43) + '" width="' + (26 + (r * 5 + c * 3) % 12) + '" height="8" fill="' + C.cream2 + '" opacity=".7"/>' +
               garabato(x + 15, y + 48, 18 + (r + c) % 3 * 5, C.night, 0.6, r * 7 + c + 1);
      }
    }
    svg += "</g>";

    // Casillero especial: se enciende al resolver (columna 3, fila 1)
    svg += '<g id="s2open" style="opacity:0" pointer-events="none"><rect x="152" y="84" width="56" height="52" fill="none" stroke="' + C.pink + '" stroke-width="2.4"/>' +
           '<rect x="148" y="80" width="64" height="60" fill="' + C.pink + '" opacity=".12"/></g>';

    // Mesa
    svg += '<g filter="url(#mano)"><rect x="-80" y="266" width="520" height="500" fill="' + C.wood2 + '"/>' +
           '<rect x="-80" y="266" width="520" height="5" fill="' + C.wood3 + '"/>' +
           vetas(-60, 276, 500, 260, 14, "#2a2030", 0.38, 31) + vetas(-60, 540, 500, 140, 6, "#2a2030", 0.38, 32) + "</g>";

    // Registro (libro)
    svg += '<g id="s2ledger" filter="url(#mano)">' +
      '<rect x="22" y="284" width="316" height="238" rx="3" fill="' + C.cream2 + '"/>' +
      '<rect x="18" y="280" width="316" height="238" rx="3" fill="' + C.cream + '"/>' +
      '<rect x="18" y="280" width="9" height="238" fill="' + C.pinkDk + '"/>' +
      '<rect x="296" y="518" width="14" height="30" fill="' + C.pink + '"/>' +
      '<path d="M178 282 V516" stroke="' + C.night + '" stroke-width="1" opacity=".1"/>' +
      anillo(304, 302, 16, 5, C.kraftDk, 0.5) + mancha(52, 500, 14, C.kraftDk, 0.18, 41) +
      '<text x="176" y="310" text-anchor="middle" font-size="12" letter-spacing="3.4" font-weight="bold" fill="' + C.night + '">REGISTRO DE ENTREGA</text>' +
      '<rect x="46" y="318" width="260" height="1.5" fill="' + C.night + '" opacity=".35"/>' +
      '<g font-size="11.4" fill="' + C.night + '">' +
        '<text x="40" y="338">1. El ámbar abre el registro.</text>' +
        '<text x="40" y="356">2. El rosa va justo después del azul.</text>' +
        '<text x="40" y="374">3. El crema no cierra el registro.</text>' +
      '</g>' +
      '<rect x="46" y="384" width="260" height="1.5" fill="' + C.night + '" opacity=".35"/>';
    // Espacios del registro
    for (let i = 0; i < 4; i++) {
      svg += '<g class="tappable s2slot" data-i="' + i + '">' +
        '<rect class="s2slotbg" x="' + SLOT_X[i] + '" y="' + SLOT_Y + '" width="' + SLOT_W + '" height="' + SLOT_H + '" rx="3" fill="' + C.cream2 + '" fill-opacity=".45" stroke="' + C.night + '" stroke-width="1.4" stroke-dasharray="4 3"/>' +
        '<text x="' + (SLOT_X[i] + 32) + '" y="' + (SLOT_Y + 74) + '" text-anchor="middle" font-size="11" fill="' + C.night + '" opacity=".6">' + (i + 1) + "</text>";
      Object.keys(COLOR).forEach((id) => {
        svg += '<g class="imp" data-slot="' + i + '" data-id="' + id + '" style="display:none" pointer-events="none">' +
          '<rect x="' + (SLOT_X[i] + 6) + '" y="' + (SLOT_Y + 5) + '" width="52" height="50" rx="3" fill="' + COLOR[id] + '" stroke="' + C.night + '" stroke-width="1.6"/>' +
          icono(id, SLOT_X[i] + 32, SLOT_Y + 30, 1) + "</g>";
      });
      svg += "</g>";
    }
    // Botón de sellar
    svg += '<g id="s2seal" class="tappable">' +
      '<rect x="102" y="486" width="156" height="26" rx="2" fill="' + C.night + '"/>' +
      '<text x="180" y="503" text-anchor="middle" font-size="12" letter-spacing="4" fill="' + C.pinkPl + '">SELLAR</text>' +
      '</g>';
    // Sello de “ENTREGADO” (aparece al resolver)
    svg += '<g id="s2done" style="opacity:0;transition:opacity .25s, transform .35s cubic-bezier(.2,1.6,.4,1);transform-origin:178px 440px;transform:scale(2.2) rotate(-12deg)" pointer-events="none">' +
      '<rect x="62" y="408" width="232" height="64" rx="4" fill="none" stroke="' + C.pinkDk + '" stroke-width="4"/>' +
      '<text x="178" y="450" text-anchor="middle" font-size="30" font-weight="bold" letter-spacing="5" fill="' + C.pinkDk + '">ENTREGADO</text></g>';
    svg += "</g>";

    // Soporte de sellos
    svg += '<rect filter="url(#mano)" x="18" y="550" width="324" height="90" rx="4" fill="' + C.wood + '"/>' +
           '<rect x="18" y="550" width="324" height="5" fill="#2a2030"/>';
    RACK_ORDEN.forEach((id, k) => {
      const cx = RACK_CX[k];
      svg += '<g class="tappable s2stamp" filter="url(#mano)" data-id="' + id + '" style="transition:transform .25s">' +
        '<rect x="' + (cx - 13) + '" y="558" width="26" height="30" rx="9" fill="' + C.wood3 + '"/>' +
        '<rect x="' + (cx - 19) + '" y="586" width="38" height="6" rx="2" fill="#8d7a96"/>' +
        '<rect x="' + (cx - 27) + '" y="592" width="54" height="30" rx="3" fill="' + COLOR[id] + '"/>' +
        '<rect x="' + (cx - 27) + '" y="620" width="54" height="4" rx="1" fill="' + C.night + '" opacity=".35"/>' +
        icono(id, cx, 607, 0.85) +
        "</g>";
    });
    svg += '<text x="180" y="662" text-anchor="middle" font-size="9.5" letter-spacing="2.4" fill="' + C.cream2 + '" opacity=".6">TOCÁ UN SELLO Y LUEGO UN ESPACIO</text>';

    const wrap = makeSVG(svg);
    const el = wrap.querySelector("svg");

    // ---------- Estado de los espacios ----------
    const slots = [null, null, null, null];
    let sel = null, bloqueado = false;

    function pintar() {
      el.querySelectorAll(".imp").forEach((g) => {
        const i = +g.dataset.slot;
        g.style.display = slots[i] === g.dataset.id ? "" : "none";
      });
      el.querySelectorAll(".s2stamp").forEach((g) => {
        const id = g.dataset.id;
        const colocado = slots.indexOf(id) !== -1;
        g.style.opacity = colocado ? "0.14" : "1";
        g.style.transform = sel === id ? "translateY(-12px)" : "none";
      });
      el.querySelectorAll(".s2slotbg").forEach((r, i) => {
        r.setAttribute("stroke", sel && !slots[i] ? C.pinkDk : C.night);
        r.setAttribute("stroke-width", sel && !slots[i] ? 2.2 : 1.4);
      });
    }

    el.querySelectorAll(".s2stamp").forEach((g) => {
      g.addEventListener("click", () => {
        if (bloqueado) return;
        const id = g.dataset.id;
        if (slots.indexOf(id) !== -1) return;
        sel = sel === id ? null : id;
        Sonido.play("tap");
        pintar();
      });
    });
    el.querySelectorAll(".s2slot").forEach((g) => {
      g.addEventListener("click", () => {
        if (bloqueado) return;
        const i = +g.dataset.i;
        if (sel) {
          slots[i] = sel; sel = null;      // si había uno, vuelve solo al soporte
          Sonido.play("sello");
        } else if (slots[i]) {
          slots[i] = null; Sonido.play("papel");
        }
        pintar();
      });
    });

    // ---------- Pared de casilleros ----------
    el.querySelector("#s2wall").addEventListener("click", () =>
      UI.card("Los casilleros", "Cada casillero guarda cartas que nunca llegaron. Casi todas esperan un sello. El cartero las ordenaba siguiendo el registro."));

    // ---------- Sellar ----------
    const ok = new Promise((resolve) => {
      el.querySelector("#s2seal").addEventListener("click", async () => {
        if (bloqueado) return;
        if (slots.some((s) => !s)) {
          Sonido.play("error");
          return UI.say("Faltan sellos en el registro.", 2800);
        }
        bloqueado = true;
        Sonido.play("sello");
        await sleep(350);
        const correcto = slots.every((s, i) => s === Sala2.SOLUCION[i]);
        if (correcto) {
          // Cámara al registro: el sello cae con peso
          await UI.zoomA(178, 430, 1.3, 1400, 0.5);
          const d = el.querySelector("#s2done");
          d.style.transition = "opacity .2s, transform .28s cubic-bezier(.5,0,.9,.6)";
          d.style.opacity = "1"; d.style.transform = "scale(1) rotate(-12deg)";
          await sleep(260);
          Sonido.play("sello");
          const led = el.querySelector("#s2ledger");
          await UI.mover(led, 3, 90); await UI.mover(led, -1, 100); await UI.mover(led, 0, 120);
          await sleep(1700);
          // Se abre un casillero de la pared y sale un sobre
          await UI.zoomFuera(1300);
          await UI.zoomA(180, 112, 2.0, 1600, 0.58);
          Sonido.play("cajon");
          const hueco = el.querySelector("#s2open");
          hueco.style.transition = "opacity 1.1s"; hueco.style.opacity = "1";
          await sleep(1200);
          await UI.emerger(180, 130);
          resolve();
        } else {
          Sonido.play("error");
          UI.shake(el.querySelector("#s2ledger"));
          UI.say("Algo no encaja en el registro. Revisá las tres reglas.", 3600);
          await sleep(500);
          await UI.penalizar();
          bloqueado = false;
        }
      });
    });

    pintar();
    return {
      el: wrap,
      resuelto: ok,
      alEntrar() { UI.say("Los sellos están desordenados. El registro dice cómo deben ir.", 5200); },
      destruir() {}
    };
  }
};

</script>
<script>
/*
 ////////////////////////////////////////////////////////////////////
 ////////////  SALA 3 · EL ARCHIVO (DISCO DE CIFRADO)  //////////////
 ////////////////////////////////////////////////////////////////////
 Mecánica: un papel con letras sin sentido y un disco de dos anillos.
 Cada letra del anillo fijo lleva un número al azar (1 a 26). Para cada
 letra del papel hay que girar la rueda hasta su número y tocar FIJAR; la
 letra verdadera aparece sola. Equivocarse solo sacude el disco.
*/

const Sala3 = {
  id: 2,
  kicker: "Sala 3",
  titulo: "El archivo",
  pistas: [
    "El papel está escrito en clave. Mirá la letra marcada en rosa y buscala en el anillo de afuera del disco: tiene un número chiquito al lado.",
    "Girá el disco hasta ese número. Lo ves en el centro del disco, en POSICIÓN. Cuando coincida, tocá FIJAR y aparece la letra verdadera.",
    "Hacelo letra por letra, de izquierda a derecha, siempre con la que está marcada en rosa. Cada letra tiene su propio número."
  ],

  construir() {
    const CX = 180, CY = 510, RO = 106;
    const PASO = 360 / 26;
    const ABC = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    // Limpia la frase y calcula el texto cifrado
    const frase = CONFIG.FRASE_SECRETA.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/[^A-Z ]/g, "");
    const claves = CONFIG.FECHA_NOVIOS.replace(/\D/g, "").split("").map(Number);   // 14/12 → [1,4,1,2]
    const rot = (ch, n) => { const i = ABC.indexOf(ch); return i === -1 ? ch : ABC[mod(i + n, 26)]; };
    // Posiciones de las letras (sin contar espacios) y su número de llave
    const letras = [];
    frase.split("").forEach((ch, i) => { if (ch !== " ") letras.push({ pos: i, ch, k: claves[letras.length % claves.length] }); });
    const cifrado = frase.split("").map((ch, i) => { const l = letras.find((x) => x.pos === i); return l ? rot(ch, l.k) : ch; }).join("");

    // Cada letra del anillo fijo lleva un número distinto del 1 al 26, al azar
    const NUMS = {};
    {
      const pool = Array.from({ length: 26 }, (_, i) => i + 1);
      for (let i = pool.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [pool[i], pool[j]] = [pool[j], pool[i]]; }
      ABC.split("").forEach((ch, i) => (NUMS[ch] = pool[i]));
    }

    let svg = "";

    // Pared
    svg += '<g filter="url(#mano)"><rect x="-80" y="-20" width="520" height="780" fill="' + C.night2 + '"/>';
    for (let x = -60; x < 420; x += 30) svg += '<rect x="' + x + '" y="-20" width="2" height="780" fill="#283050"/>';
    svg += mancha(40, 300, 26, C.night3, 0.3, 51) + mancha(320, 288, 20, C.night3, 0.3, 52) + vetas(-40, 20, 440, 50, 3, C.night3, 0.5, 53) + "</g>";

    // Archivador
    svg += '<rect filter="url(#mano)" x="20" y="82" width="320" height="200" rx="4" fill="' + C.wood + '" stroke="#2a2030" stroke-width="2"/>';
    const flavor = [
      "Cartas dirigidas a gente que se mudó. Ninguna lleva tu nombre.",
      "Vacío. Alguien se llevó lo que había.",
      "Sellos viejos de países que ya no existen.",
      "Un rollo de hilo, una cinta y una estampilla suelta.",
      "Papeles sueltos con direcciones tachadas.",
      "Una libreta con las páginas arrancadas."
    ];
    const OBJ_R = 1, OBJ_C = 2; // cajón que se abre al resolver
    let n = 0;
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 4; c++) {
        const x = 27 + c * 78, y = 90 + r * 62;
        const objetivo = (r === OBJ_R && c === OBJ_C);
        svg += '<g class="tappable s3dr" filter="url(#mano)" data-obj="' + (objetivo ? 1 : 0) + '" data-f="' + (n % flavor.length) + '"' + (objetivo ? ' id="s3target"' : "") + ">" +
          '<rect x="' + x + '" y="' + y + '" width="72" height="56" rx="2" fill="#241a28"/>' +
          '<g class="face"' + (r === 2 && c === 0 ? ' transform="translate(0 6)"' : "") + ">" +
            '<rect x="' + x + '" y="' + y + '" width="72" height="54" rx="2" fill="' + C.wood2 + '" stroke="#2e2230" stroke-width="1.5"/>' +
            '<rect x="' + (x + 20) + '" y="' + (y + 12) + '" width="32" height="13" fill="' + C.cream2 + '"/>' +
            '<text x="' + (x + 36) + '" y="' + (y + 22) + '" text-anchor="middle" font-size="9" fill="' + C.night + '">' + ABC[n] + "</text>" +
            '<rect x="' + (x + 28) + '" y="' + (y + 36) + '" width="16" height="5" rx="2.5" fill="' + C.cream2 + '"/>' +
          "</g></g>";
        n++;
      }
    }

    // Nota pegada
    svg += '<g id="s3note" class="tappable" filter="url(#mano)"><g transform="translate(0 22) rotate(5 310 112)">' +
      '<rect x="284" y="70" width="52" height="64" fill="' + C.cream + '"/>' +
      '<rect x="297" y="63" width="26" height="12" fill="' + C.pinkPl + '" opacity=".9"/>' +
      '<g fill="' + C.night3 + '"><rect x="292" y="88" width="36" height="2"/><rect x="292" y="98" width="30" height="2"/><rect x="292" y="108" width="36" height="2"/><rect x="292" y="118" width="22" height="2"/></g>' +
      "</g></g>";

    // Mesa
    svg += '<g filter="url(#mano)"><rect x="-80" y="292" width="520" height="500" fill="' + C.wood2 + '"/><rect x="-80" y="292" width="520" height="5" fill="' + C.wood3 + '"/>' +
           vetas(-60, 300, 500, 330, 16, "#2a2030", 0.38, 61) + "</g>";

    // Papel con el mensaje
    const tam = cifrado.length <= 8 ? 28 : cifrado.length <= 12 ? 21 : 15;
    svg += '<g filter="url(#mano)" transform="rotate(-1.2 180 340)">' +
      '<rect x="34" y="304" width="292" height="84" fill="' + C.cream + '"/>' +
      '<text id="s3win" x="180" y="322" text-anchor="middle" font-size="9" letter-spacing="2" fill="' + C.night3 + '">MENSAJE INTERCEPTADO</text>' +
      '<text id="s3cipher" x="180" y="354" text-anchor="middle" font-size="' + tam + '" letter-spacing="5" font-weight="bold" fill="' + C.night + '">' +
        cifrado.split("").map((ch, i) => '<tspan data-p="' + i + '">' + (ch === " " ? "\u00a0" : ch) + "</tspan>").join("") + "</text>" +
      '<text id="s3plain" x="180" y="379" text-anchor="middle" font-size="14" letter-spacing="4" fill="' + C.pinkDk + '"></text>' +
      '<path d="M34 346 H326" stroke="' + C.night + '" stroke-width="1" opacity=".07"/>' +
      anillo(296, 330, 15, 5, C.kraftDk, 0.5) +
      '<rect x="26" y="298" width="24" height="10" fill="' + C.pinkPl + '" opacity=".75" transform="rotate(-35 38 303)"/>' +
      '<rect x="310" y="382" width="24" height="10" fill="' + C.pinkPl + '" opacity=".75" transform="rotate(-35 322 387)"/>' +
      "</g>";

    // Disco de cifrado: anillo exterior fijo
    svg += '<g id="s3disc">' +
      '<circle cx="' + CX + '" cy="' + CY + '" r="' + (RO + 3) + '" fill="' + C.night + '"/>' +
      '<circle cx="' + CX + '" cy="' + CY + '" r="' + RO + '" fill="' + C.night3 + '" stroke="' + C.cream2 + '" stroke-width="1.5"/>';
    for (let j = 0; j < 26; j++) {
      const a = j * PASO;
      svg += '<text class="s3o" data-l="' + ABC[j] + '" x="' + CX + '" y="' + (CY - 92) + '" text-anchor="middle" font-size="11.5" font-weight="bold" fill="' + C.cream + '" transform="rotate(' + a.toFixed(2) + " " + CX + " " + CY + ')">' + ABC[j] + "</text>" +
        '<text class="s3n" data-l="' + ABC[j] + '" x="' + CX + '" y="' + (CY - 82) + '" text-anchor="middle" font-size="8" fill="' + C.cream2 + '" transform="rotate(' + a.toFixed(2) + " " + CX + " " + CY + ')">' + NUMS[ABC[j]] + "</text>";
      svg += '<rect x="' + (CX - 0.7) + '" y="' + (CY - RO) + '" width="1.4" height="7" fill="' + C.cream2 + '" opacity=".5" transform="rotate(' + (a + PASO / 2).toFixed(2) + " " + CX + " " + CY + ')"/>';
    }
    // Anillo interior giratorio
    svg += '<g id="s3inner" style="transition:transform .16s ease-out;transform-origin:' + CX + "px " + CY + 'px">' +
      '<circle cx="' + CX + '" cy="' + CY + '" r="78" fill="' + C.cream2 + '"/>' +
      '<circle cx="' + CX + '" cy="' + CY + '" r="52" fill="none" stroke="' + C.night + '" stroke-width="1" opacity=".5"/>';
    for (let k = 0; k < 26; k++) {
      const a = k * PASO;
      svg += '<text x="' + CX + '" y="' + (CY - 62) + '" text-anchor="middle" font-size="11" font-weight="bold" fill="' + (k === 0 ? C.pinkDk : C.night) + '" transform="rotate(' + a.toFixed(2) + " " + CX + " " + CY + ')">' + ABC[k] + "</text>";
    }
    svg += "</g>" +
      '<circle cx="' + CX + '" cy="' + CY + '" r="41" fill="' + C.night + '" stroke="' + C.pink + '" stroke-width="1.5"/>' +
      '<text x="' + CX + '" y="' + (CY - 12) + '" text-anchor="middle" font-size="7.5" letter-spacing="2.4" fill="' + C.cream2 + '">POSICIÓN</text>' +
      '<text id="s3pos" x="' + CX + '" y="' + (CY + 16) + '" text-anchor="middle" font-size="30" font-weight="bold" fill="' + C.pink + '">1</text>' +
      '<polygon points="' + (CX - 7) + "," + (CY - RO - 9) + " " + (CX + 7) + "," + (CY - RO - 9) + " " + CX + "," + (CY - RO + 3) + '" fill="' + C.pink + '"/>' +
      "</g>";

    // Botón para fijar la posición del disco
    svg += '<g id="s3fix" class="tappable"><rect x="118" y="632" width="124" height="30" rx="3" fill="' + C.night + '" stroke="' + C.pink + '" stroke-width="1.5"/>' +
      '<text x="180" y="652" text-anchor="middle" font-size="12" letter-spacing="4" fill="' + C.pinkPl + '">FIJAR</text></g>';

    // Flechas laterales
    [["s3prev", 44, "M4 -9 L-5 0 L4 9"], ["s3next", 316, "M-4 -9 L5 0 L-4 9"]].forEach((b) => {
      svg += '<g id="' + b[0] + '" class="tappable"><circle cx="' + b[1] + '" cy="' + CY + '" r="20" fill="' + C.night3 + '" stroke="' + C.cream2 + '" stroke-width="1.5"/>' +
        '<path transform="translate(' + b[1] + " " + CY + ')" d="' + b[2] + '" fill="none" stroke="' + C.cream + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>';
    });

    const wrap = makeSVG(svg);
    const el = wrap.querySelector("svg");
    const $ = (id) => el.querySelector("#" + id);

    // ---------- Giro del disco ----------
    let s = 0, resuelto = false, esperando = null;

    function actualizar() {
      $("s3inner").style.transform = "rotate(" + (s * PASO) + "deg)";
      $("s3pos").textContent = s + 1;
      pinta();
    }
    // Línea de progreso: letras ya traducidas y puntos por las que faltan
    let hechas = 0;
    function visor() {
      $("s3win").textContent = hechas < letras.length ? "CADA LETRA TIENE SU NÚMERO EN EL DISCO" : "MENSAJE INTERCEPTADO";
    }
    function pinta() {
      visor();
      $("s3plain").textContent = frase.split("").map((ch, i) => {
        if (ch === " ") return "\u00a0\u00a0";
        const n = letras.findIndex((x) => x.pos === i);
        return n < hechas ? ch : "·";
      }).join(" ");
      el.querySelectorAll("#s3cipher tspan").forEach((t) => {
        const n = letras.findIndex((x) => x.pos === +t.dataset.p);
        t.setAttribute("fill", n === hechas ? C.pinkDk : n >= 0 && n < hechas ? C.night3 : C.night);
        t.setAttribute("opacity", n >= 0 && n < hechas ? 0.45 : 1);
      });
    }
    // Fijar el disco en la posición actual (si es la incorrecta, se traba)
    let fijando = false;
    async function fijar() {
      if (resuelto || fijando) return;
      fijando = true;
      Sonido.play("tap");
      await sleep(350);
      const actual = letras[hechas];
      if (s + 1 === NUMS[cifrado[actual.pos]]) {
        hechas++; Sonido.play("par"); pinta();
        if (hechas === letras.length) { terminar(); return; }
        UI.say("Una letra menos. Ahora, la siguiente.", 2600);
        fijando = false; return;
      }
      Sonido.play("error");
      UI.shake($("s3inner"));
      UI.say("Ese no es el número de esa letra. Mirá bien el disco.", 3600);
      await sleep(900);
      fijando = false;
    }

    function paso(d) {
      if (resuelto) return;
      s = mod(s + d, 26);
      Sonido.play("tick");
      actualizar();
    }

    let giro = null;
    el.addEventListener("pointerdown", (e) => {
      if (resuelto) return;
      const p = svgPoint(el, e.clientX, e.clientY);
      const dx = p.x - CX, dy = p.y - CY, dist = Math.hypot(dx, dy);
      if (dist < 42 || dist > RO + 14) return;
      giro = { a0: Math.atan2(dx, -dy) * 180 / Math.PI, s0: s };
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener("pointermove", (e) => {
      if (!giro || resuelto) return;
      const p = svgPoint(el, e.clientX, e.clientY);
      const a = Math.atan2(p.x - CX, -(p.y - CY)) * 180 / Math.PI;
      let d = a - giro.a0;
      if (d > 180) d -= 360; if (d < -180) d += 360;
      const ns = mod(giro.s0 + Math.round(d / PASO), 26);
      if (ns !== s) { s = ns; Sonido.play("tick"); actualizar(); }
    });
    const finGiro = () => { giro = null; };
    el.addEventListener("pointerup", finGiro);
    el.addEventListener("pointercancel", finGiro);
    $("s3prev").addEventListener("click", () => paso(-1));
    $("s3next").addEventListener("click", () => paso(1));
    $("s3fix").addEventListener("click", fijar);

    // ---------- Objetos ----------
    $("s3note").addEventListener("click", () =>
      UI.card("Nota del cartero",
        "«Cada letra de ese papel tiene un número en el disco. Poné la rueda en ese número y fijala: " +
        "la letra verdadera aparece sola. Así, de a una.»"));
    el.querySelectorAll(".s3dr").forEach((g) => {
      g.addEventListener("click", () => {
        if (resuelto) return;
        if (g.dataset.obj === "1") UI.card("Un cajón cerrado", "Este cajón no tiene cerradura de llave. Se abre con una frase, y la frase está escrita en clave. La llave de la clave es una fecha.");
        else UI.card("Cajón", flavor[+g.dataset.f]);
      });
    });

    // ---------- Resolución ----------
    let terminarFn;
    const ok = new Promise((r) => { terminarFn = r; });
    async function terminar() {
      resuelto = true;
      Sonido.play("chime");
      $("s3plain").textContent = frase;
      $("s3plain").setAttribute("fill", C.pink);
      $("s3plain").setAttribute("font-weight", "bold");
      UI.say("Esa frase te suena.", 3600);
      await sleep(2200);
      await UI.zoomA(219, 179, 2.6, 1800, 0.5);
      Sonido.play("candado");
      await sleep(700);
      const t = $("s3target").querySelector(".face");
      Sonido.play("cajon");
      await UI.mover(t, 5, 500);
      await sleep(150);
      await UI.mover(t, 46, 1700, 0);
      await UI.emerger(219, 176);
      terminarFn();
    }

    actualizar();
    return {
      el: wrap,
      resuelto: ok,
      alEntrar() { UI.say("Un mensaje sin sentido y un disco de cifrado. La llave tiene que ser una fecha.", 5600); },
      destruir() { clearTimeout(esperando); }
    };
  }
};

</script>
<script>
/*
 ////////////////////////////////////////////////////////////////////
 /////////////  SALA 4 · LA TORRE DE RADIO (SEÑAL)  /////////////////
 ////////////////////////////////////////////////////////////////////
 Mecánica: una radio con un osciloscopio. La onda rosa es la señal objetivo.
 Con dos controles (frecuencia y fase) hay que superponer la onda crema.
 A medida que se acerca, la estática baja y aparece una melodía.
*/

const Sala4 = {
  id: 3,
  kicker: "Sala 4",
  titulo: "La torre de radio",
  pistas: [
    "La señal llega mezclada con estática. Tenés dos controles para sintonizarla.",
    "La línea rosa es la señal que hay que alcanzar. Movés los controles hasta que la línea crema se superponga.",
    "Primero ajustá la frecuencia hasta que ambas ondas tengan la misma cantidad de picos. Después ajustá la fase hasta que coincidan exactamente."
  ],

  construir() {
    // Parámetros de la señal objetivo
    const F0 = 3.4, P0 = 2.1;
    const F_MIN = 1.0, F_MAX = 6.0;
    const SX = 60, SW = 240, SY = 224, AMP = 56, N = 90;     // pantalla
    const TX0 = 66, TX1 = 294;                                 // rieles de los controles

    let svg = "";
    svg += '<rect x="-80" y="-20" width="520" height="780" fill="' + C.night + '"/>';

    // Antenas
    svg += '<g stroke="' + C.cream2 + '" stroke-width="2.4" stroke-linecap="round"><line x1="96" y1="86" x2="70" y2="62"/><line x1="264" y1="86" x2="290" y2="62"/></g>' +
           '<circle cx="70" cy="62" r="4" fill="' + C.pink + '"/><circle cx="290" cy="62" r="4" fill="' + C.pink + '"/>';

    // Carcasa de la radio
    svg += '<g filter="url(#mano)"><rect x="22" y="86" width="316" height="566" rx="22" fill="' + C.wood + '" stroke="#2a2030" stroke-width="2"/>' +
           vetas(24, 90, 312, 60, 4, "#2a2030", 0.5, 71) + vetas(24, 600, 312, 48, 4, "#2a2030", 0.5, 72) +
           '<rect x="36" y="100" width="288" height="538" rx="14" fill="' + C.night2 + '"/>' +
           '<circle cx="46" cy="110" r="3" fill="' + C.cream2 + '" opacity=".6"/><circle cx="314" cy="110" r="3" fill="' + C.cream2 + '" opacity=".6"/>' +
           '<circle cx="46" cy="628" r="3" fill="' + C.cream2 + '" opacity=".6"/><circle cx="314" cy="628" r="3" fill="' + C.cream2 + '" opacity=".6"/>' +
           '<rect x="120" y="446" width="120" height="15" fill="' + C.cream + '" opacity=".9" transform="rotate(-1 180 453)"/>' +
           garabato(126, 456, 106, C.night, 0.7, 73) +
           '<rect x="276" y="142" width="22" height="14" fill="' + C.pinkDk + '" opacity=".0"/>' +
           mancha(300, 600, 22, C.night3, 0.5, 74) + "</g>" +
           '<text x="180" y="124" text-anchor="middle" font-size="10" letter-spacing="5" fill="' + C.cream2 + '">RADIO · TORRE NORTE</text>';

    // Pantalla
    svg += '<rect x="52" y="140" width="256" height="168" rx="8" fill="' + C.deep + '" stroke="' + C.cream2 + '" stroke-width="1.5"/>';
    for (let i = 1; i < 8; i++) svg += '<rect x="' + (52 + i * 32) + '" y="142" width="1" height="164" fill="#1d2744"/>';
    for (let j = 1; j < 6; j++) svg += '<rect x="54" y="' + (140 + j * 28) + '" width="252" height="1" fill="' + (j === 3 ? "#2a3560" : "#1d2744") + '"/>';
    svg += '<path id="s4target" fill="none" stroke="' + C.pink + '" stroke-width="2" stroke-dasharray="5 4" opacity=".9"/>' +
           '<path id="s4user" fill="none" stroke="' + C.cream + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>' +
           '<g id="s4ok" style="opacity:0;transition:opacity .5s" pointer-events="none">' +
             '<rect x="52" y="140" width="256" height="168" rx="8" fill="' + C.deep + '" opacity=".78"/>' +
             '<text x="180" y="230" text-anchor="middle" font-size="15" letter-spacing="5" fill="' + C.pink + '">SEÑAL FIJADA</text></g>';

    // Medidor de señal
    svg += '<text x="52" y="337" font-size="9" letter-spacing="3" fill="' + C.cream2 + '">SEÑAL</text>';
    for (let i = 0; i < 8; i++) svg += '<rect class="s4bar" x="' + (104 + i * 24) + '" y="327" width="18" height="12" rx="2" fill="' + C.night3 + '"/>';

    // Altavoz
    svg += '<rect x="52" y="362" width="256" height="78" rx="6" fill="#151a2c"/>';
    for (let i = 0; i < 8; i++) svg += '<rect x="62" y="' + (372 + i * 8.2) + '" width="236" height="3.4" rx="1.7" fill="' + C.night3 + '"/>';

    // Controles
    function control(id, etiqueta, y) {
      let s = '<text x="52" y="' + (y - 28) + '" font-size="10" letter-spacing="4" fill="' + C.cream2 + '">' + etiqueta + "</text>" +
        '<rect x="' + TX0 + '" y="' + (y - 3) + '" width="' + (TX1 - TX0) + '" height="6" rx="3" fill="' + C.night3 + '"/>';
      for (let i = 0; i <= 10; i++) s += '<rect x="' + (TX0 + i * (TX1 - TX0) / 10 - 0.7) + '" y="' + (y + 12) + '" width="1.4" height="' + (i % 5 === 0 ? 9 : 5) + '" fill="' + C.cream2 + '" opacity=".5"/>';
      s += '<g id="' + id + 'h"><circle r="17" fill="' + C.cream + '" stroke="' + C.pinkDk + '" stroke-width="2.5"/><circle r="5" fill="' + C.pinkDk + '"/></g>' +
           '<rect class="s4track" data-k="' + id + '" x="46" y="' + (y - 24) + '" width="268" height="48" fill="transparent"/>';
      return s;
    }
    svg += control("s4f", "FRECUENCIA", 504) + control("s4p", "FASE", 580);

    const wrap = makeSVG(svg);
    const el = wrap.querySelector("svg");
    const $ = (id) => el.querySelector("#" + id);

    // ---------- Estado de los controles (0 a 1) ----------
    const val = { s4f: 0.12, s4p: 0.7 };
    const Y = { s4f: 504, s4p: 580 };
    let activo = null, fijado = false, resuelto = false;

    const freq  = () => F_MIN + val.s4f * (F_MAX - F_MIN);
    const fase  = () => val.s4p * Math.PI * 2;

    function ruta(f, p, jitter) {
      let d = "";
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        let y = SY - AMP * Math.sin(2 * Math.PI * f * t + p);
        if (jitter) y += (Math.random() * 2 - 1) * jitter;
        d += (i ? "L" : "M") + (SX + t * SW).toFixed(1) + " " + y.toFixed(1);
      }
      return d;
    }
    $("s4target").setAttribute("d", ruta(F0, P0, 0));

    function cercania() {
      const df = Math.abs(freq() - F0);
      const dp = Math.abs(mod(fase() - P0 + Math.PI, Math.PI * 2) - Math.PI);
      const c = Math.max(0, 1 - df / 1.5) * Math.max(0, 1 - dp / 1.9);
      return { c, ok: df <= (CONFIG.DIFICIL ? 0.12 : 0.15) && dp <= (CONFIG.DIFICIL ? 0.18 : 0.22) };
    }

    let radio = null, mantener = 0, ultimo = { c: 0, ok: false };

    function dibujar() {
      ["s4f", "s4p"].forEach((k) => {
        $(k + "h").setAttribute("transform", "translate(" + (TX0 + val[k] * (TX1 - TX0)) + " " + Y[k] + ")");
      });
      ultimo = cercania();
      const jit = fijado ? 0 : 9 * Math.pow(1 - ultimo.c, 1.6);
      $("s4user").setAttribute("d", ruta(freq(), fase(), jit));
      $("s4user").setAttribute("stroke", fijado ? C.pink : C.cream);
      const encendidas = fijado ? 8 : Math.round(ultimo.c * 8 - 0.4);
      el.querySelectorAll(".s4bar").forEach((b, i) => b.setAttribute("fill", i < encendidas ? C.pink : C.night3));
      if (radio) radio.set(fijado ? 1 : ultimo.c);
    }

    // ---------- Arrastre de los controles ----------
    function desde(e) {
      const p = svgPoint(el, e.clientX, e.clientY);
      val[activo] = clamp((p.x - TX0) / (TX1 - TX0), 0, 1);
      dibujar();
    }
    el.addEventListener("pointerdown", (e) => {
      const t = e.target.closest(".s4track");
      if (!t || fijado) return;
      activo = t.dataset.k;
      el.setPointerCapture(e.pointerId);
      desde(e);
    });
    el.addEventListener("pointermove", (e) => { if (activo && !fijado) desde(e); });
    const suelta = () => { activo = null; };
    el.addEventListener("pointerup", suelta);
    el.addEventListener("pointercancel", suelta);

    // ---------- Bucle: estática viva + detección de coincidencia ----------
    let terminarFn;
    const ok = new Promise((r) => { terminarFn = r; });
    const timer = setInterval(() => {
      if (fijado) return;
      dibujar();   // refresca la estática
      if (ultimo.ok) {
        mantener += 70;
        if (mantener >= (CONFIG.DIFICIL ? 2600 : 1800)) fijar();
      } else mantener = 0;
    }, 70);

    async function fijar() {
      fijado = true;
      dibujar();
      Sonido.play("chime");
      $("s4ok").style.opacity = "1";
      UI.say("La estática se apaga. Ahora se escucha con claridad.", 4200);
      await sleep(2800);
      if (radio) radio.stop();
      await UI.zoomA(180, 420, 1.7, 1600, 0.55);
      Sonido.play("cajon");
      await sleep(500);
      await UI.emerger(180, 436);
      terminarFn();
    }

    dibujar();
    return {
      el: wrap,
      resuelto: ok,
      alEntrar() {
        radio = Sonido.radio();
        dibujar();
        UI.say("Una radio vieja. La señal llega, pero cortada.", 5200);
      },
      destruir() { clearInterval(timer); if (radio) radio.stop(); }
    };
  }
};

</script>
<script>
/*
 ////////////////////////////////////////////////////////////////////
 ////////////  SEGUNDOS DESAFÍOS (UNO POR SALA, PASO 2)  ////////////
 ////////////////////////////////////////////////////////////////////
 Cada sala tiene un segundo desafío, distinto del primero:
   Paso1 · Carta rota       (sala 1)  ordenar tiras de papel
   Paso2 · Buzón de sobres  (sala 2)  puzzle deslizante 3x3
   Paso3 · Memoria          (sala 3)  encontrar los pares
   Paso4 · Secuencia radio  (sala 4)  repetir una melodía
 Todos exponen { pistas[3], construir() → { el, resuelto, alEntrar, destruir } }
*/

// ===================================================================
// FONDO COMÚN: primer plano de madera, para que se sienta "más cerca"
// ===================================================================
function fondoCierre(seed) {
  return '<rect x="-80" y="-20" width="520" height="780" fill="' + C.wood + '"/>' +
    '<g filter="url(#mano)">' + vetas(-40, 0, 440, 720, 26, "#2a2030", 0.45, seed) + "</g>" +
    mancha(40, 640, 30, C.night3, 0.35, seed + 3) + anillo(312, 96, 22, 17, C.wood3, 0.5);
}

// Detecta el elemento tocado (con data-i) dentro de la escena
function tocado(e) {
  const t = e.target && e.target.closest ? e.target.closest("[data-i]") : null;
  return t ? +t.getAttribute("data-i") : -1;
}

// ===================================================================
// PASO 1 · CARTA ROTA (sala 1)
// ===================================================================
const Paso1 = {
  pistas: [
    "La carta se rompió en tiras y quedaron mezcladas. Tocá dos tiras para intercambiarlas.",
    "Una carta empieza siempre por un saludo, y termina con lo que no se pudo entregar.",
    "Primero va el saludo. Después las frases se encadenan: \"a la única oficina del mundo\" va antes de \"donde se guardan las cosas\"."
  ],
  construir() {
    const LINEAS = [
      "mi amor:",
      "si estás leyendo esto,",
      "es porque lograste entrar",
      "a la única oficina del mundo",
      "donde se guardan las cosas",
      "que no pude entregarte en persona."
    ];
    const X = 30, W = 300, H = 70, STEP = 82, Y0 = 128;
    // Orden mezclado con a lo sumo un acierto de entrada
    let orden;
    do {
      orden = LINEAS.map((_, i) => i).sort(() => Math.random() - 0.5);
    } while (orden.filter((v, i) => v === i).length > 1);

    let svg = fondoCierre(81);
    svg += '<text x="180" y="96" text-anchor="middle" font-size="10" letter-spacing="5" fill="' + C.cream2 + '">CARTA ROTA</text>';
    LINEAS.forEach((txt, id) => {
      const R = rng(500 + id * 13);
      let d = "M0 " + (R() * 4).toFixed(1);
      for (let x = 12; x <= W; x += 12) d += " L" + x + " " + (R() * 5).toFixed(1);
      d += " L" + W + " " + (H - R() * 4).toFixed(1);
      for (let x = W - 12; x >= 0; x -= 12) d += " L" + x + " " + (H - R() * 5).toFixed(1);
      d += " Z";
      svg += '<g class="p1s" data-i="' + id + '" style="transform:translate(' + X + "px," + Y0 + 'px);transition:transform .45s ease">' +
        '<g class="p1in" style="transform-box:fill-box;transform-origin:center;transition:transform .3s">' +
        '<path d="' + d + '" fill="' + [C.cream, "#efe2d0", "#f0e6d6", "#ead9c2", C.cream, "#f1e4d3"][id] + '" stroke="' + C.cream2 + '" stroke-width="1.5" transform="translate(0 -1)"/>' +
        (id % 2 ? mancha(40 + id * 37, 44, 9, C.kraftDk, 0.22, 60 + id) : anillo(250 - id * 9, 36, 15, 9, C.kraftDk, 0.35)) +
        '<path d="M' + (8 + id * 6) + ' ' + (H - 9) + ' q' + (60 + id * 11) + ' ' + (id % 2 ? 3 : -3) + ' ' + (110 + id * 7) + ' 0" fill="none" stroke="' + C.night + '" stroke-width="1" opacity=".18"/>' +
        '<path class="p1sel" d="' + d + '" fill="none" stroke="' + C.pinkDk + '" stroke-width="3" opacity="0"/>' +
        '<text x="' + (W / 2) + '" y="' + (H / 2 + 5) + '" text-anchor="middle" transform="rotate(' + ((id % 3) - 1) * 0.9 + " " + (W / 2) + " " + (H / 2) + ')" font-size="' + (txt.length > 30 ? 13 : 16) + '" font-style="italic" fill="' + C.night + '" opacity=".92" style="filter:url(#tinta)">' + txt + "</text>" +
        "</g></g>";
    });
    const wrap = makeSVG(svg);
    const el = wrap.querySelector("svg");
    const tiras = [...el.querySelectorAll(".p1s")];
    let sel = -1, resolver, hecho = false;
    const ok = new Promise((r) => (resolver = r));
    const inclinacion = (id) => ((id * 37) % 7 - 3) * 0.7;

    function pinta(alineado) {
      orden.forEach((id, pos) => {
        const t = tiras[id];
        t.style.transform = "translate(" + (X + (alineado ? 0 : ((id * 5) % 9) - 4)) + "px," + (Y0 + pos * STEP) + "px)";
        t.querySelector(".p1in").style.transform = "rotate(" + (alineado ? 0 : inclinacion(id)) + "deg)";
        t.querySelector(".p1sel").setAttribute("opacity", id === sel ? 1 : 0);
      });
      wrap.dataset.orden = orden.join(",");
    }
    function revisa() {
      if (orden.every((v, i) => v === i)) {
        hecho = true; sel = -1; pinta(true);
        Sonido.play("sello");
        setTimeout(() => resolver(), 900);
      }
    }
    el.addEventListener("pointerdown", (e) => {
      if (hecho) return;
      const id = tocado(e);
      if (id < 0) return;
      Sonido.play("papel");
      if (sel < 0) { sel = id; pinta(false); return; }
      if (sel === id) { sel = -1; pinta(false); return; }
      const a = orden.indexOf(sel), b = orden.indexOf(id);
      [orden[a], orden[b]] = [orden[b], orden[a]];
      sel = -1; pinta(false); revisa();
    });
    pinta(false);
    return { el: wrap, resuelto: ok, alEntrar() { UI.say("Alguien rompió esta carta antes de enviarla.", 4200); }, destruir() {} };
  }
};

// ===================================================================
// PASO 2 · BUZÓN DE SOBRES (sala 2) · puzzle deslizante 3x3
// ===================================================================
const Paso2 = {
  pistas: [
    "Los sobres tienen que quedar numerados en orden, de izquierda a derecha y de arriba abajo. Tocá uno al lado del hueco para deslizarlo.",
    "Armá primero la fila de arriba. Después la siguiente. Las dos últimas filas se resuelven juntas, con paciencia.",
    "Mirá el esquema pequeño de abajo: así debe quedar. Si te trabás, deshacé el último movimiento antes de seguir."
  ],
  construir() {
    const D = false, N = 3;
    const T = D ? 68 : 92, G = D ? 6 : 8, BY = 150;
    const HB = N * T + (N - 1) * G, BX = (360 - HB) / 2;
    const META = Array.from({ length: N * N }, (_, i) => (i < N * N - 1 ? i + 1 : 0));
    // Mezcla con movimientos válidos (siempre tiene solución)
    let b = META.slice(), vacio = N * N - 1, previo = -1;
    for (let k = 0; k < (D ? 160 : 40) || b.every((v, i) => v === META[i]); k++) {
      const x = vacio % N, y = (vacio / N) | 0, vec = [];
      if (x > 0) vec.push(vacio - 1);
      if (x < N - 1) vec.push(vacio + 1);
      if (y > 0) vec.push(vacio - N);
      if (y < N - 1) vec.push(vacio + N);
      const op = vec.filter((v) => v !== previo);
      const n = op[(Math.random() * op.length) | 0];
      b[vacio] = b[n]; b[n] = 0; previo = vacio; vacio = n;
    }
    const pos = (p) => ({ x: BX + (p % N) * (T + G), y: BY + ((p / N) | 0) * (T + G) });

    let svg = fondoCierre(91);
    svg += '<text x="180" y="108" text-anchor="middle" font-size="10" letter-spacing="5" fill="' + C.cream2 + '">BUZÓN · ORDENAR LOS SOBRES</text>';
    svg += '<rect x="' + (BX - 8) + '" y="' + (BY - 8) + '" width="' + (HB + 16) + '" height="' + (HB + 16) + '" rx="6" fill="' + C.deep + '" opacity=".6"/>';
    for (let n = 1; n < N * N; n++) {
      const R = rng(700 + n * 31), col = ["#c9a77c", "#c4a176", "#cfae85", "#bf9d73", "#c9a77c", "#d2b48c", "#c2a078", "#cbab80"][(n - 1) % 8];
      const j = () => ((R() - 0.5) * 5).toFixed(1);
      svg += '<g class="p2t" data-i="' + n + '" style="transition:transform .22s ease"><g filter="url(#mano)" transform="rotate(' + ((R() - 0.5) * 3.6).toFixed(1) + " " + T / 2 + " " + T / 2 + ')">' +
        '<path d="M' + j() + " " + j() + " L" + (T + +j()) + " " + j() + " L" + (T + +j()) + " " + (T + +j()) + " L" + j() + " " + (T + +j()) + ' Z" fill="' + col + '" stroke="' + C.kraftDk + '" stroke-width="2"/>' +
        '<path d="M2 3 L' + (T / 2 + +j()) + " " + (T * 0.5 + +j()) + " L" + (T - 2) + ' 3" fill="' + C.kraftDk + '" opacity=".5" stroke="' + C.kraftDk + '" stroke-width="1.5"/>' +
        (n % 3 === 0 ? mancha(70, 74, 9, C.wood, 0.18, n) : n % 3 === 1 ? anillo(24, 70, 11, 7, C.wood, 0.28) : '<path d="M' + (T - 26) + ' ' + (T - 2) + " l22 -22 v22 Z" + '" fill="' + C.kraftDk + '" opacity=".45"/>') +
        '<circle cx="' + (T / 2 + +j()) + '" cy="' + (T * 0.5 + 2) + '" r="' + (8 + R() * 3).toFixed(1) + '" fill="' + (n % 2 ? C.pinkDk : C.pink) + '"/>' +
        '<text x="' + (T / 2 + (R() * 8 - 4)).toFixed(1) + '" y="' + (T - 14 + (R() * 4 - 2)).toFixed(1) + '" text-anchor="middle" font-size="' + (21 + ((R() * 4) | 0)) + '" font-style="italic" transform="rotate(' + ((R() - 0.5) * 12).toFixed(1) + " " + T / 2 + " " + (T - 16) + ')" fill="' + C.night + '" style="filter:url(#tinta)">' + n + "</text></g></g>";
    }
    // Esquema de referencia
    const CS = D ? 20 : 26, ST = CS + 4;
    svg += '<text x="180" y="' + (D ? 486 : 508) + '" text-anchor="middle" font-size="9" letter-spacing="4" fill="' + C.cream2 + '">ASÍ DEBE QUEDAR</text>';
    for (let p = 0; p < N * N; p++) {
      const rx = 180 - (N * ST) / 2 + (p % N) * ST, ry = (D ? 498 : 522) + ((p / N) | 0) * ST;
      svg += '<rect x="' + rx + '" y="' + ry + '" width="' + CS + '" height="' + CS + '" rx="2" fill="' + (META[p] ? C.kraft : "none") + '" stroke="' + C.kraftDk + '" stroke-width="1"/>' +
        (META[p] ? '<text x="' + (rx + CS / 2) + '" y="' + (ry + CS * 0.7) + '" text-anchor="middle" font-size="' + (CS / 2) + '" fill="' + C.night + '">' + META[p] + "</text>" : "");
    }
    svg += '<g id="p2ok" style="opacity:0;transition:opacity .5s" pointer-events="none"><rect x="' + BX + '" y="' + (BY + HB / 2 - 34) + '" width="' + HB + '" height="68" fill="' + C.deep + '" opacity=".85"/>' +
      '<text x="180" y="' + (BY + HB / 2 + 8) + '" text-anchor="middle" font-size="20" letter-spacing="6" fill="' + C.pink + '">ABIERTO</text></g>';

    const wrap = makeSVG(svg);
    const el = wrap.querySelector("svg");
    const fichas = {};
    el.querySelectorAll(".p2t").forEach((g) => (fichas[g.getAttribute("data-i")] = g));
    let resolver, hecho = false;
    const ok = new Promise((r) => (resolver = r));

    function pinta() {
      b.forEach((n, p) => { if (n) { const q = pos(p); fichas[n].style.transform = "translate(" + q.x + "px," + q.y + "px)"; } });
      wrap.dataset.tablero = b.join(",");
    }
    el.addEventListener("pointerdown", (e) => {
      if (hecho) return;
      const n = tocado(e);
      if (n < 1) return;
      const p = b.indexOf(n), v = b.indexOf(0);
      const dx = Math.abs((p % N) - (v % N)), dy = Math.abs(((p / N) | 0) - ((v / N) | 0));
      if (dx + dy !== 1) { Sonido.play("tick"); return; }
      b[v] = n; b[p] = 0; Sonido.play("papel"); pinta();
      if (b.every((x, i) => x === META[i])) {
        hecho = true; Sonido.play("sello");
        el.querySelector("#p2ok").style.opacity = 1;
        setTimeout(() => resolver(), 1100);
      }
    });
    pinta();

// ===================================================================
// PASO 3 · MEMORIA (sala 3) · encontrar los pares
// ===================================================================
const Paso3 = {
  pistas: [
    "Dos cartas iguales forman un par. Si no coinciden, se vuelven a esconder.",
    "Fijate en el lugar de cada símbolo antes de que se tapen. Empezá por las esquinas.",

  ],

    const COLS = D ? 4 : 3, CW = D ? 70 : 92, CH = D ? 88 : 112, GAP = 8, BY = D ? 102 : 112;
    const BX = (360 - (COLS * CW + (COLS - 1) * GAP)) / 2;
    const mazo = NOMBRES.concat(NOMBRES).sort(() => Math.random() - 0.5);

      if (n === "bolsa")
